# Checks every PR; on merge to main, deploys the whole sim as one Cloudflare Worker
# (apps/cloudflare) and smoke-tests the live site.
#
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Cloudflare dashboard → My Profile → API Tokens →
# "Edit Cloudflare Workers" template, scoped to the account in apps/cloudflare/wrangler.jsonc).
name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PUBLIC_URL: https://hackathon-incident-lab.kualia.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the five UIs into the Worker's assets
        run: pnpm --filter @sim/cloudflare build:ui
      - name: Deploy the Worker
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
      - name: Smoke test the live site (services and MCP contracts; no scenario runs)
        env:
          SIM_PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$SIM_PUBLIC_URL/health" > /dev/null && break
            sleep 2
          done
          pnpm e2e --skip-scenarios
