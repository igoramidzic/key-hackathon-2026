# Everything the briefing SAYS and SHOWS lives in this file.
#
#   1. Edit the text or numbers below.
#   2. Rebuild:            uv run --python 3.12 demo/build.py
#      ...and the video:   uv run --python 3.12 demo/build.py --video
#   3. Open demo/briefing.html in a browser to watch it.
#
# How it is organised
#   scenes:      one block per chapter, played in the order written here.
#     chapter:   the chapter name in the player.
#     narration: what the voice says, one line per "beat". Each beat has an id (o1, p2, ...).
#                Use {text: ..., say: ...} when the voice needs a different spelling than the
#                caption ("ServiceNow" on screen, "Service Now" spoken).
#     screen:    what is on screen during that chapter.
#
# Timing ("at")
#   Anything with `at:` appears when the voice reaches that point:
#     at: p2        when beat p2 starts          at: p2.e      when beat p2 ends
#     at: p2@0.5    halfway through beat p2      at: p2+1.5    1.5 s after p2 starts
#   Narration length sets the timing, so if you rewrite a line the visuals follow automatically.
#
# Numbers that are both spoken and shown (the metrics, "under three minutes", ...) appear twice:
# once in `narration` and once in `screen`. Change both. They are marked with  <- spoken too.
#
# Text rules
#   *like this* is highlighted. [[like this]] is the green "good" highlight.
#   Keep text in "double quotes". It is always safe, and required when the text contains
#   a comma, a colon, a question mark or a #. For a " inside quoted text write \".
#   If the file has a mistake, the build stops and tells you the line.

# Which voice reads the narration.
#   kokoro      free, runs on this Mac, no account. Clear but a little flat.
#   elevenlabs  far more human. Needs an account and:  export ELEVENLABS_API_KEY=...
#               The narration text is sent to ElevenLabs. The whole script is about 4,000
#               characters, so one full build fits in the free plan's monthly allowance.
voice_engine: elevenlabs

# Used when voice_engine is kokoro
voice: bm_george        # any Kokoro voice: bm_george, bm_fable, bf_emma, am_michael, af_heart, ...
speed: 1.0              # 1.1 = 10% faster

# Used when voice_engine is elevenlabs
elevenlabs:
  voice_id: pxeJebjUnLgBeU0AumkE     # "hackathon-1": the custom voice designed in the ElevenLabs account (deep, gravelly New York).
                                     # Previous narrators: pqHfZKP75CvOlQylNhV4 Bill, JBFqnCBsd6RMkjVDRZzb George
                                     # Other American female voices on this account:
                                     #   XrExE9yKIg1WjnnlVkGX Matilda (knowledgeable, professional)
                                     #   hpp4J3VqNfWAUOO0d1Us Bella (professional, bright, warm)
                                     #   cgSgspJ2msm6clMCkdW9 Jessica (playful, bright, warm)
                                     #   EXAVITQu4vr4xnSDxMaL Sarah (mature, confident)
  speed: 1.21 # 1.0 = as recorded. Changing this costs no credits.
  model: eleven_v3                   # most expressive. eleven_multilingual_v2 is steadier.
  settings: {stability: 0.5}         # lower = more emotion and variation, higher = more even
pacing: {lead_in: 0.8, gap: 0.3, tail: 0.7}   # seconds of silence: scene start / between beats / scene end

hud: "Operation *NightWatch*"          # top-left corner of every scene, beside the radar mark
player: {start: "Start briefing", replay: "Replay briefing"}

scenes:
  # ------------------------------------------------------------------ title
  open:
    chapter: Briefing
    narration:
      o1: {text: "Good evening. This is your briefing on Operation NightWatch.", say: "Good evening. This is your briefing on Operation Nightwatch."}
      o2:
        text: "The target: production incidents. The asset: an AI agent that spots the trouble, files the report, assembles the right team, and finds the fix, before anyone picks up a phone."
        say: "The target: production incidents. The asset: an A.I. agent that spots the trouble, files the report, assembles the right team, and finds the fix, before anyone picks up a phone."
    screen:
      kicker: Mission briefing · Hackathon 2026
      title: [Operation, NightWatch]          # second word is the bold one
      lede: {at: o2@0.28, text: "An AI agent that spots the incident, files the report, assembles the right team and finds the fix."}
      verbs:
        - {at: o2@0.4, text: "Detect"}
        - {at: o2@0.52, text: "Report"}
        - {at: o2@0.62, text: "Assemble"}
        - {at: o2@0.74, text: "Remediate"}
      stamp: {at: o1@0.55, text: "Classified"}

  # ------------------------------------------------------------------ the problem
  prob:
    chapter: The problem
    narration:
      p1: Seven minutes past two in the morning. A routine change ships at a bank that runs four hundred applications.
      p2: Within a minute, online banking, mobile, and payments begin to fail.
      p3: Alerts fire from every direction. But the service that caused it looks perfectly healthy. It is still answering every request.
      p4: Nobody knows where to look, and the clock is running.
    screen:
      kicker: File 01 // The problem
      clock: {start: "02:07:00", speed: 4}    # wall clock; runs `speed` times faster than real time
      sub: A routine change ships to production.
      alerts:
        - {at: p3, level: "CRITICAL", text: "Online Banking: 5xx error rate 38.4%"}
        - {at: p3@0.12, level: "CRITICAL", text: "Mobile Banking: 5xx error rate 27.9%"}
        - {at: p3@0.24, level: "MAJOR", text: "Payments: failed payment rate 21.6%"}
      question: {at: p4, text: "Where do you look?"}
      estate:
        total: 400                            # squares in the grid   <- spoken too (p1)
        failing: 36                           # how many turn red
        labelled:                             # the first ones to fail, with a name tag
          - {at: p2@0.3, text: "Online Banking"}
          - {at: p2@0.52, text: "Mobile"}
          - {at: p2@0.68, text: "Payments"}
        spread: [p2@0.8, p3@0.5]              # the rest turn red between these two moments
        culprit: {at: p3@0.4, text: "200 OK · looks healthy"}
        legend: {total: "applications", failing: "failing", cause: "*1* cause, still green"}

  # ------------------------------------------------------------------ current state
  now:
    chapter: "Today: manual"
    narration:
      n1: Today, a priority one incident is a manual relay.
      n2: Incident Management hears about it from a page, a monitor, an email, or the incident phone line.
      n3:
        text: "They open a parent incident in ServiceNow and bring any child incidents under it."
        say: "They open a parent incident in Service Now and bring any child incidents under it."
      n4: They gather teams to set impact, urgency and priority, while standing up a Teams chat and a recorded call.
      n5: Corporate incident response is engaged and the critical incident communication goes out. Only then does the hunt for the cause really begin.
      n6: On average, service is back an hour and eighteen minutes after it went down.
    screen:
      kicker: File 02 // Current state
      badge: P1                               # the red tag in front of the headline
      headline: Today, a critical incident is a manual relay
      # The steps are KeyBank's critical incident process. 10, 30 and 35 minutes and the total
      # (1 h 18 min, the real P1 average from the `cost` scene) are Incident Management's
      # figures; the two times in between are illustrative.
      steps:                                  # time = elapsed so far, HH:MM (shown as "22 min", "1 h 05 min"). "+00:25" adds to the total.
        - {at: n2, time: "00:10", text: "Incident Management is made aware", tool: "Page · NOC · monitor · phone"}
        - {at: n3, time: "00:20", text: "Open the parent incident, link child incidents", tool: "ServiceNow"}
        # `also` is a second thing done at the same moment, shown under the first (`joiner` puts a small label between them).
        - {at: n4, time: "00:30", text: "Gather teams, set the priority", also: "Open the Teams chat and a recorded call", tool: "Teams"}
        - {at: n5, time: "00:35", text: "Engage CIR, send the incident communication", tool: "CIC · email"}
        - {at: n5@0.62, time: "00:55", text: "Find the cause", tool: "Logs + GitLab"}
        - {at: n6@0.1, time: "01:18", text: "Restore service, then write it all up", tool: "ServiceNow"}
      elapsed:
        at: n1@0.5
        label: Elapsed                        # counts up in hours and minutes, each labelled
        note: {at: n5.e, text: "The service is still down."}
      stamp: {at: n6@0.7, text: "All manual"}

  # ------------------------------------------------------------------ metrics
  cost:
    chapter: The cost
    narration:
      c2: Over the last three months, a priority one incident took an average of one hour and eighteen minutes to resolve.
      c3: Priority two took well over three hours. Every one of those minutes costs the bank revenue and customers.
    screen:
      kicker: File 03 // What it costs
      subject: "P1 and P2 incidents, August to October"
      exhibit: Exhibit A · average time to resolve
      stats:                                  # real figures from Incident Management, for the application that caused the incident. <- spoken too (c2, c3)
        - {at: c2@0.5, value: "1h 18m", label: "Priority 1 incidents"}
        - {at: c3, value: "3h 23m", label: "Priority 2 incidents"}
      line: {at: c3@0.5, text: "Every minute an application is down costs the bank revenue and customers."}
      footnote: {at: c3@0.5, text: "Measured on the application that caused the incident. The applications it impacted took 1 h 48 min (P1) and 2 h 52 min (P2)."}
      stamp: {at: c3.e-0.3, text: "Too slow"}

  # ------------------------------------------------------------------ the agent
  impl:
    chapter: How it works
    pacing: {tail: 2.4}                       # hold the finished diagram before moving on
    narration:
      i2: "NightWatch reads the production logs constantly, looking for a trigger: the first sign of an error."
      i3: That trigger starts the orchestrator agent, which plans the investigation and sends out sub-agents.
      i4:
        text: "Each sub-agent asks one system for what it needs, through that system's MCP server."
        say: "Each sub-agent asks one system for what it needs, through that system's M.C.P. server."
      i5: Their findings flow back up to the orchestrator. It names the cause, proposes the fix, and briefs the right people. A human makes the final call.
    screen:
      kicker: File 04 // How it works
      headline: One orchestrator, a team of sub-agents
      watch:
        at: i2
        heading: Always watching
        logo: gcloud                          # logos: gcloud, kibana, gitlab, servicenow, teams, gemini, microsoft, key
        title: Production logs
        sub: every entry, as it is written
        lines: ["12:04:07  payments-api  200 OK", "12:04:07  mobile-bff  200 OK"]
        error: {at: i2@0.72, text: "12:04:08  online-banking  500"}
      trigger: {at: i3@0.08, text: "Trigger event"}
      agent: {at: i3@0.25, title: "Orchestrator agent", sub: "Plans the investigation, delegates, decides what happens next"}
      subagents:
        at: i3@0.7
        heading: Sub-agents, one per system
        ask: asks                             # the two labels on the wires
        answer: findings
        # `at` = when the sub-agent and its request appear; `back_at` = when its findings return.
        items:
          - {at: i3@0.78, back_at: i5@0.02, name: "Logs sub-agent", gets: "errors, traces, blast radius", logo: gcloud, system: "Cloud Logging"}
          - {at: i4@0.05, back_at: i5@0.08, name: "Code sub-agent", gets: "recent changes and diffs", logo: gitlab, system: "GitLab"}
          - {at: i4@0.33, back_at: i5@0.14, name: "Records sub-agent", gets: "owners, changes, incidents", logo: servicenow, system: "ServiceNow"}
          - {at: i4@0.62, back_at: i5@0.2, name: "People sub-agent", gets: "who to bring in, and where", logo: teams, system: "Teams"}
      flow_lead: Then the orchestrator
      flow:                                   # style: human = the highlighted "a person decides" step
        - {at: i5@0.3, text: "Names the cause"}
        - {at: i5@0.45, text: "Proposes the fix"}
        - {at: i5@0.6, text: "Briefs the right people"}
        - {at: i5@0.8, text: "A human makes the final call", style: human}

  # ------------------------------------------------------------------ the simulated bank
  sim:
    chapter: Training ground
    narration:
      i7: "To train it safely, we built a simulated bank: four hundred applications, twelve hundred people, and failures with decoys planted along the way."
    screen:
      kicker: File 05 // The training ground
      headline: A simulated bank
      text: "Mock Cloud Logging, ServiceNow, GitLab and Teams with seeded data. The agent sees only what an engineer on shift would see."
      tiles:                                  # <- spoken too (i7)
        - {at: i7@0.36, value: "400", label: "applications"}
        - {at: i7@0.50, value: "1,199", label: "people"}
        - {at: i7@0.56, value: "51", label: "support groups"}
        - {at: i7@0.62, value: "776", label: "code repositories"}
        - {at: i7@0.68, value: "5", label: "incident scenarios"}
      chips:
        at: i7@0.8
        items: [Decoy merges in every case, The culprit stays green, Background noise never stops]

  # ------------------------------------------------------------------ demo
  demo:
    chapter: Live case
    pacing: {gap: 1.4, tail: 1.4}             # a breath between lines, so each screen can be read
    # This scene plays a recording of the real guided demo (control panel -> /demo?present=1): the
    # actual Logs, ServiceNow, GitLab and Teams screens, with the agent working a live scenario.
    # Re-record with  uv run demo/record_live.py  (see README). The numbers spoken here (six
    # applications, eight people) come from that run, so after re-recording check them.
    narration:
      d1: Let's watch it work, in a real run on the simulated bank.
      d2: A change ships, and errors start to climb in the logs. NightWatch notices within seconds, before anyone is paged.
      d4: It works out that every failing application is the same problem, and rates it priority one.
      d5:
        text: "It opens the parent incident in ServiceNow, assigned to the team that owns it. Help desk tickets about the same outage go underneath."
        say: "It opens the parent incident in Service Now, assigned to the team that owns it. Help desk tickets about the same outage go underneath."
      d6: It stands up the Teams chat, named for the incident, and brings in the right people. Each is told why they are there.
      d7: It posts the briefing, and turns the chat into a recorded call.
      d9: Then it looks for the cause. It checks GitLab for recent changes, rules out the ones that don't fit, and names the one that does.
      d8: That change renamed every field in the customer profile. It passed review, and never returned an error itself.
      d10: It suggests a fix, written as a merge request. A person decides, and clicks merge.
      d11:
        text: "It creates the emergency change in ServiceNow and posts the link in the chat, for a person to review and edit."
        say: "It creates the emergency change in Service Now and posts the link in the chat, for a person to review and edit."
      d12: The release goes out, and the errors drain away.
      d13: Then the paperwork. It checks the merge and the change request to know when service is back, then fills out the resolution from the call recording, the chat messages, and everything else it gathered.
      d14:
        text: "And it opens the problem record, ready for tomorrow's 8 AM stand-up."
        say: "And it opens the problem record, ready for tomorrow's eight A.M. stand-up."
      d16: Based on our estimate, NightWatch cuts the time to resolve priority one and priority two incidents in half.
      d17: At twenty priority ones and ninety priority twos a year, that is about a hundred and sixty-five hours of outage avoided.
    screen:
      live:
        recording: live/run.mp4               # made by record_live.py, with live/run.json beside it
        video: live.mp4                       # what the build cuts from it; do not edit by hand
        keep_top: 1.0                         # the recording is already just the stage
        max_speed: 1.15                       # footage that does not fit is cut short, not fast-forwarded past this
        # Small labels over the recording, in the empty right half of the page header.
        notes:
          - {at: d13@0.12, off: d13@0.46, lead: "Knows when", items: [{logo: gitlab, text: "Fix merged"}, {logo: servicenow, text: "Change deployed"}, {logo: gcloud, text: "Errors gone"}]}
          - {at: d13@0.5, off: d14, lead: "Filled in from", items: [{logo: teams, text: "Call recording"}, {logo: teams, text: "Chat messages"}, {logo: gcloud, text: "Logs"}, {logo: gitlab, text: "Code changes"}, {logo: servicenow, text: "Change requests"}]}
        tag: "Recorded run · real UIs · scenario cif-snake-case-cascade at 4x"
        # Which step of the recorded tour plays from which moment of the narration. `show` is the
        # step's title in live/run.json. Each part runs until the next one starts; if the step is
        # shorter it holds its last frame, if longer its end is dropped (`keep: end` drops the
        # start instead). Optional: `skip` seconds into the step, `take` seconds of it, `to` a
        # later step to run through, `speed` to allow fast-forward, `from_event: merge_click`
        # (the one thing a person does).
        cuts:
          - {show: "A normal afternoon", skip: 2}
          - {at: d2, show: "Errors appear"}
          - {at: d4, show: "How bad is it?"}
          - {at: d5, show: "It opens the parent incident", skip: 1}
          - {at: d5@0.66, show: "Tickets about the same problem are grouped under it", keep: end}
          - {at: d6, show: "One chat, with the right people in it"}
          - {at: d7, show: "And briefs them", skip: 1}
          - {at: d9, show: "It finds the cause"}
          - {at: d8, show: "This is the change", skip: 1}
          - {at: d10, show: "Your turn: merge it", keep: end}
          - {at: d11, show: "It creates the change request and links it in the chat", skip: 1}
          - {at: d11@0.56, show: "The change request, open to review and edit", skip: 1}
          - {at: d12, show: "Then checks it actually worked", keep: end}
          - {at: d13, show: "It fills out the incident", skip: 1}
          - {at: d14, show: "It opens the problem record"}
      result:
        at: d16@0.05
        label: "Estimated time to resolve, with NightWatch"
        today: "Today:"
        text: "50% less"
        drop_at: d16@0.42                     # each figure starts at today's average, then falls to the estimate
        items:                                # hours:minutes. `from` is the average in the `cost` scene, `to` is half of it
          - {name: "Priority 1 incidents", from: "01:18", to: "00:39", per_year: "20 a year", saved: "13 hours saved"}
          - {name: "Priority 2 incidents", from: "03:23", to: "01:42", per_year: "90 a year", saved: "152 hours saved"}
        # Over a year: incidents expected this year x the time saved on each (39 min and 1 h 41.5 min).  <- spoken too (d17)
        year: {at: d17@0.1, total_at: d17@0.5, label: "Over a year", total: "165 hours", text: "of outage avoided"}

  # ------------------------------------------------------------------ path to production
  prod:
    chapter: Path to production
    pacing: {tail: 1.2}
    narration:
      g2: The path to production runs on what KeyBank already has. Google Gemini does the reasoning.
      g3:
        text: "It reads production through the GCP and Kibana MCP servers, and the code through GitLab and the recently launched KeyBank Codebase Analyst."
        say: "It reads production through the G.C.P. and Kibana M.C.P. servers, and the code through Git Lab and the recently launched KeyBank Codebase Analyst."
      g4:
        text: "Microsoft Copilot Studio connects it to Teams and ServiceNow, where the incident team already works."
        say: "Microsoft Copilot Studio connects it to Teams and Service Now, where the incident team already works."
      g5: Everything we need to go to production is already in place.
    screen:
      kicker: File 06 // Path to production
      headline: Everything it needs is already at Key
      agent: {at: g2@0.55, logo: gemini, title: "NightWatch", sub: "reasoning by Google Gemini"}
      reads_label: reads
      acts_label: acts
      reads:                                  # what the agent reads; every arrow goes into the agent. style: have = the green badge
        - {at: g3@0.14, logo: gcloud, name: "Google Cloud Logging", badge: "MCP"}
        - {at: g3@0.26, logo: kibana, name: "Kibana", badge: "MCP"}
        - {at: g3@0.5, logo: gitlab, name: "GitLab", badge: "MCP"}
        - {at: g3@0.66, logo: key, name: "KeyBank Codebase Analyst", badge: "Just launched", style: have}
      acts:                                   # where the agent acts; one arrow out of the agent
        at: g4
        logo: microsoft
        name: Microsoft Copilot Studio
        items:
          - {logo: teams, name: "Teams", text: "chat and calls"}
          - {logo: servicenow, name: "ServiceNow", text: "incidents and changes"}
      ready: {at: g5, tag: "Ready today", text: "Nothing new to buy or build before production."}
      guards:
        - {at: g5@0.5, name: "A human", text: "makes the final call"}
        - {at: g5@0.65, name: "No merge, no delete", text: "by design"}
        - {at: g5@0.8, name: "Every action", text: "written to the incident record"}

  # ------------------------------------------------------------------ expansion
  next:
    chapter: Future enhancements
    narration:
      x2: "Once the basics are in place, future enhancements widen the scope. Automatic phone calls to on-call support off hours. The same playbook for non-production. Drafting the critical incident communication emails. And a memory of every past case."
    screen:
      kicker: File 07 // Future enhancements
      headline: Once the basics are in, the scope can grow
      items:
        - {at: x2@0.3, title: "Off-hours phone calls", text: "Call the on-call support person automatically when nobody is watching chat."}
        - {at: x2@0.5, title: "Non-production", text: "The same playbook, minus the ServiceNow steps, for lower environments."}
        - {at: x2@0.66, title: "CIC email drafts", text: "Draft the Critical Incident Communication emails for internal communications. A person sends them."}
        - {at: x2@0.86, title: "Case memory", text: "Every solved incident makes the next diagnosis faster."}

  # ------------------------------------------------------------------ close
  end:
    chapter: Close
    narration:
      e1: NightWatch. Faster detection, the right people, a clear root cause. And critical services back sooner.
      e2: End of briefing.
    screen:
      kicker: Operation NightWatch
      title: [Agent, NightWatch]
      outcomes:
        - {at: e1@0.2, text: "Faster detection"}
        - {at: e1@0.36, text: "The right people"}
        - {at: e1@0.5, text: "A clear root cause"}
      line: {at: e1@0.7, text: "And critical services back sooner."}
      stamp: {at: e2@0.3, text: "End of briefing"}
