# Everything the briefing SAYS and SHOWS lives in this file.
#
#   1. Edit the text or numbers below.
#   2. Rebuild:            uv run --python 3.12 demo/build.py
#      ...and the video:   uv run --python 3.12 demo/build.py --video
#   3. Open demo/briefing.html in a browser to watch it.
#
# How it is organised
#   scenes:      one block per chapter, played in the order written here.
#     chapter:   the chapter name in the player.
#     narration: what the voice says, one line per "beat". Each beat has an id (o1, p2, ...).
#                Use {text: ..., say: ...} when the voice needs a different spelling than the
#                caption ("ServiceNow" on screen, "Service Now" spoken).
#     screen:    what is on screen during that chapter.
#
# Timing ("at")
#   Anything with `at:` appears when the voice reaches that point:
#     at: p2        when beat p2 starts          at: p2.e      when beat p2 ends
#     at: p2@0.5    halfway through beat p2      at: p2+1.5    1.5 s after p2 starts
#   Narration length sets the timing, so if you rewrite a line the visuals follow automatically.
#
# Numbers that are both spoken and shown (the metrics, "under three minutes", ...) appear twice:
# once in `narration` and once in `screen`. Change both. They are marked with  <- spoken too.
#
# Text rules
#   *like this* is highlighted. [[like this]] is the green "good" highlight.
#   Keep text in "double quotes". It is always safe, and required when the text contains
#   a comma, a colon, a question mark or a #. For a " inside quoted text write \".
#   If the file has a mistake, the build stops and tells you the line.

# Which voice reads the narration.
#   kokoro      free, runs on this Mac, no account. Clear but a little flat.
#   elevenlabs  far more human. Needs an account and:  export ELEVENLABS_API_KEY=...
#               The narration text is sent to ElevenLabs. The whole script is about 4,000
#               characters, so one full build fits in the free plan's monthly allowance.
voice_engine: elevenlabs

# Used when voice_engine is kokoro
voice: bm_george        # any Kokoro voice: bm_george, bm_fable, bf_emma, am_michael, af_heart, ...
speed: 1.0              # 1.1 = 10% faster

# Used when voice_engine is elevenlabs
elevenlabs:
  voice_id: pxeJebjUnLgBeU0AumkE     # "hackathon-1": the custom voice designed in the ElevenLabs account (deep, gravelly New York).
                                     # Previous narrators: pqHfZKP75CvOlQylNhV4 Bill, JBFqnCBsd6RMkjVDRZzb George
                                     # Other American female voices on this account:
                                     #   XrExE9yKIg1WjnnlVkGX Matilda (knowledgeable, professional)
                                     #   hpp4J3VqNfWAUOO0d1Us Bella (professional, bright, warm)
                                     #   cgSgspJ2msm6clMCkdW9 Jessica (playful, bright, warm)
                                     #   EXAVITQu4vr4xnSDxMaL Sarah (mature, confident)
  speed: 1.17 # 1.0 = as recorded. Changing this costs no credits.
  model: eleven_v3                   # most expressive. eleven_multilingual_v2 is steadier.
  settings: {stability: 0.5}         # lower = more emotion and variation, higher = more even
pacing: {lead_in: 0.9, gap: 0.32, tail: 0.75}   # seconds of silence: scene start / between beats / scene end

hud: "Operation *NightWatch*"          # top-left corner of every scene
player: {start: "Start briefing", replay: "Replay briefing"}

scenes:
  # ------------------------------------------------------------------ title
  open:
    chapter: Briefing
    narration:
      o1: {text: "Good evening. This is your briefing on Operation NightWatch.", say: "Good evening. This is your briefing on Operation Nightwatch."}
      o2:
        text: "The target: production incidents. The asset: an AI agent that spots the trouble, files the report, and assembles the right team, before anyone picks up a phone."
        say: "The target: production incidents. The asset: an A.I. agent that spots the trouble, files the report, and assembles the right team, before anyone picks up a phone."
    screen:
      kicker: Mission briefing · Hackathon 2026
      title: [Operation, NightWatch]          # second word is the amber one
      lede: {at: o2@0.28, text: "An AI agent that spots the incident, files the report and assembles the right team."}
      verbs:
        - {at: o2@0.42, text: "Detect"}
        - {at: o2@0.56, text: "Report"}
        - {at: o2@0.68, text: "Assemble"}
      stamp: {at: o1@0.55, text: "Classified"}

  # ------------------------------------------------------------------ the problem
  prob:
    chapter: The problem
    narration:
      p1: Seven minutes past two in the morning. A routine change ships at a bank that runs four hundred applications.
      p2: Within a minute, online banking, mobile, and payments begin to fail.
      p3: Alerts fire from every direction. But the service that caused it looks perfectly healthy. It is still answering every request.
      p4: Nobody knows where to look, and the clock is running.
    screen:
      kicker: File 01 // The problem
      clock: {start: "02:07:00", speed: 4}    # wall clock; runs `speed` times faster than real time
      sub: A routine change ships to production.
      alerts:
        - {at: p3, level: "CRITICAL", text: "Online Banking: 5xx error rate 38.4%"}
        - {at: p3@0.12, level: "CRITICAL", text: "Mobile Banking: 5xx error rate 27.9%"}
        - {at: p3@0.24, level: "MAJOR", text: "Payments: failed payment rate 21.6%"}
      question: {at: p4, text: "Where do you look?"}
      estate:
        total: 400                            # squares in the grid   <- spoken too (p1)
        failing: 36                           # how many turn red
        labelled:                             # the first ones to fail, with a name tag
          - {at: p2@0.3, text: "Online Banking"}
          - {at: p2@0.52, text: "Mobile"}
          - {at: p2@0.68, text: "Payments"}
        spread: [p2@0.8, p3@0.5]              # the rest turn red between these two moments
        culprit: {at: p3@0.4, text: "200 OK · looks healthy"}
        legend: {total: "applications", failing: "failing", cause: "*1* cause, still green"}

  # ------------------------------------------------------------------ current state
  now:
    chapter: "Today: manual"
    narration:
      n1: Here is how a critical incident runs today. Almost every step is manual.
      n2: Incident Management hears about it from a page, the network operations center, a monitor, a Teams chat, an email, or the incident phone line.
      n3: They gather teams to judge impact and urgency, set the priority, then build a Teams chat, publish what is known, and start a recorded call.
      n4: Corporate incident response is engaged, communications go out, and only then does the hunt for the cause really begin.
      n5:
        text: "Once service is restored, the paperwork starts: the ServiceNow record, a problem record, and the post-incident summary."
        say: "Once service is restored, the paperwork starts: the Service Now record, a problem record, and the post-incident summary."
    screen:
      kicker: File 02 // Current state
      headline: Today it is a manual relay
      # The steps are KeyBank's critical incident process. The total (01:48) is the real P1
      # average from the `cost` scene; how it splits across the steps is illustrative.
      steps:                                  # time = elapsed so far, HH:MM. "+00:25" adds to the total.
        - {at: n2, time: "00:10", text: "Incident Management is made aware", tool: "Page · NOC · monitor · phone"}
        - {at: n3@0.05, time: "00:22", text: "Gather teams, set impact, urgency and priority", tool: "CIC"}
        - {at: n3@0.5, time: "00:32", text: "Create the Teams chat, publish the issue, start a recorded call", tool: "Teams"}
        - {at: n4, time: "00:40", text: "Engage CIR, send the Critical Incident Communication", tool: "ServiceNow + email"}
        - {at: n4@0.6, time: "01:05", text: "Find the cause, record Cause Identified", tool: "Logs + GitLab"}
        - {at: n5@0.08, time: "01:48", text: "Restore the service, then the record, problem record and summary", tool: "ServiceNow"}
      elapsed:
        at: n1@0.5
        label: Elapsed
        unit: "hours : minutes"
        note: {at: n4.e, text: "The service is still down."}
      stamp: {at: n5@0.6, text: "All manual"}

  # ------------------------------------------------------------------ metrics
  cost:
    chapter: The cost
    narration:
      c1: The numbers tell the story.
      c2: Over the last three months, a priority one incident took an average of one hour and forty-eight minutes to resolve for the applications it hit.
      c3: Priority two took close to three hours, and well over three for the application that caused it. Every one of those minutes costs the bank revenue and customers.
    screen:
      kicker: File 03 // What it costs
      subject: "P1 and P2 incidents, August to October"
      exhibit: Exhibit A · average time to resolve
      stats:                                  # real figures from Incident Management. <- spoken too (c2, c3)
        - {at: c2@0.45, value: "1h 48m", label: "P1 · impacted CIs"}
        - {at: c2@0.9, value: "1h 18m", label: "P1 · causing CIs"}
        - {at: c3, value: "2h 52m", label: "P2 · impacted CIs"}
        - {at: c3@0.3, value: "3h 23m", label: "P2 · causing CIs"}
      line: {at: c3@0.55, text: "Every minute a CI is down costs the bank revenue and customers."}
      stamp: {at: c3.e-0.3, text: "Too slow"}

  # ------------------------------------------------------------------ the agent
  impl:
    chapter: The agent
    narration:
      i1: Enter NightWatch.
      i2:
        text: "It watches the live log stream, the alert feeds, and new ServiceNow incidents around the clock."
        say: "It watches the live log stream, the alert feeds, and new Service Now incidents around the clock."
      i3:
        text: "When something breaks, it starts the critical incident process on its own, with forty-nine tools across four systems: logs, ServiceNow, GitLab, and Teams."
        say: "When something breaks, it starts the critical incident process on its own, with forty-nine tools across four systems: logs, Service Now, Git Lab, and Teams."
      i4: It scopes the damage, traces the dependency graph to a common cause, and finds the exact change that broke production.
      i5: Then it opens the parent incident, attaches the related incidents as children, stands up the Teams chat with the right support people, and proposes a fix. A human always makes the final call.
      i6:
        text: "It keeps ServiceNow current, raises the change request, and once service is back, completes the resolution steps the process requires."
        say: "It keeps Service Now current, raises the change request, and once service is back, completes the resolution steps the process requires."
      i7: "To train it safely, we built an entire simulated bank: four hundred applications, twelve hundred people, and realistic failures with decoys planted along the way."
    screen:
      kicker: File 04 // The asset
      headline: NightWatch
      badge:
        at: i1
        role: Field agent
        number: No. 0001
        name: NightWatch
        fields:
          - [Alias, svc_incident_auto]
          - [Shift, 24 / 7]
          - [Clearance, "Read, write. Never merge, never delete."]
      signals:
        at: i2
        heading: Signals
        items:
          - {title: "Live log stream", sub: "every entry, in order"}
          - {title: "Alert feeds", sub: "Moogsoft alerts"}
          - {title: "ServiceNow incidents", sub: "new calls, emails and chats"}
      agent: {at: i1@0.4, title: "The agent", sub: "detection rules + LLM reasoning"}
      tools:
        at: i3@0.5
        heading: 49 tools over MCP            # <- spoken too (i3)
        items:
          - {at: i3@0.74, name: "Logs", count: 9}
          - {at: i3@0.80, name: "ServiceNow", count: 17}
          - {at: i3@0.88, name: "GitLab", count: 14}
          - {at: i3@0.95, name: "Teams", count: 9}
      flow:                                   # style: human = the amber "a person decides" step
        - {at: i4@0.02, text: "Scope"}
        - {at: i4@0.25, text: "Trace"}
        - {at: i4@0.62, text: "Find the change"}
        - {at: i5@0.05, text: "Parent incident"}
        - {at: i5@0.4, text: "Teams chat"}
        - {at: i5@0.66, text: "Propose fix"}
        - {at: i5@0.8, text: "Human approves", style: human}
      note: {at: i5@0.82, text: "The agent has *no merge tool and no delete tool*. People stay in command."}
      range:                                  # the "simulated bank" card that replaces the diagram
        at: i7
        title: "The training ground: a simulated bank"
        text: "Mock Cloud Logging, ServiceNow, GitLab and Teams with seeded data. The agent sees only what an engineer on shift would see."
        tiles:                                # <- spoken too (i7)
          - {at: i7@0.36, value: "400", label: "applications"}
          - {at: i7@0.50, value: "1,199", label: "people"}
          - {at: i7@0.56, value: "51", label: "support groups"}
          - {at: i7@0.62, value: "776", label: "code repositories"}
          - {at: i7@0.68, value: "5", label: "incident scenarios"}
        chips:
          at: i7@0.8
          items: [Decoy merges in every case, The culprit stays green, Background noise never stops]

  # ------------------------------------------------------------------ demo
  demo:
    chapter: Live case
    narration:
      d1: Let's watch it work.
      d2: A change has just shipped. Errors start in online banking, then mobile, then payments.
      d3: {text: "Fifty-five seconds in, the first critical alert fires. NightWatch is already on the case.", say: "Fifty-five seconds in, the first critical alert fires. Nightwatch is already on the case."}
      d4: "Nine applications are failing. The agent walks the dependency graph and finds the one thing they share: the customer information file. A service that still looks green."
      d5:
        text: "In GitLab, it finds the suspect: a merge request that renamed every field in the customer profile. The pipeline passed. Every consumer broke."
        say: "In Git Lab, it finds the suspect: a merge request that renamed every field in the customer profile. The pipeline passed. Every consumer broke."
      d6: It opens a priority one incident, assigns the team that owns the service, and attaches three calls from branch staff reporting the same outage.
      d7: Then it stands up a Teams channel and brings in the on-call engineers, the incident commander, and the author of the change. Each of them is told exactly why they are there.
      d8: Finally, it drafts the fix. A human reviews it and clicks merge. The errors drain away, and the case is closed.
      d9: "From first error to a briefed team with a root cause: under three minutes."
    screen:
      kicker: File 05 // Live case
      headline: The customer profile outage
      tagline: [Re-enactment on the simulated bank, "scenario: cif-snake-case-cascade"]
      clock_label: Mission clock
      clock_prefix: T+
      # Mission clock: what it reads at each moment of the narration (it glides in between).
      clock:
        - [d2, "0:00"]
        - [d3, "0:52"]
        - [d3@0.3, "0:55"]                    # <- spoken too (d3)
        - [d4, "1:10"]
        - [d5, "1:35"]
        - [d6, "2:05"]
        - [d7, "2:30"]
        - [d7.e, "2:48"]                      # matches `result.big` below
        - [d8@0.3, "2:48"]
        - [d8@0.5, "6:50"]                    # a human reviews, then merges
        - [d8.e, "7:50"]
      # The six steps on the left. Each one owns a panel (in this order: logs, graph, suspect,
      # incident, channel, fix) and is active from its first beat to the next step's first beat.
      steps:
        - {name: "Detect", beats: [d2, d3], status: "watching the log stream", calls: "logs.tail_logs()  logs.list_alerts()  logs.summarize_errors()"}
        - {name: "Scope and trace", beats: [d4, d4], status: "tracing dependencies", calls: "servicenow.get_app_dependencies()  servicenow.get_app(\"CIF\")"}
        - {name: "Find the change", beats: [d5, d5], status: "reviewing recent changes", calls: "gitlab.list_merge_requests()  gitlab.get_merge_request()"}
        - {name: "Open incident", beats: [d6, d6], status: "filing the incident", calls: "servicenow.create_incident()  servicenow.link_child_incidents()"}
        - {name: "Assemble team", beats: [d7, d7], status: "assembling the team", calls: "servicenow.get_support_group()  teams.create_channel()  teams.post_message()"}
        - {name: "Fix and verify", beats: [d8, d8], status: "fix and verify", calls: "gitlab.create_merge_request()  logs.tail_logs()  servicenow.update_incident()"}
      idle: {before: "standing by", after: case closed}

      logs:
        app: Cloud Logging · Logs Explorer · production
        start_time: "02:07:30"                # timestamp of the first error
        banners:
          - {at: d3@0.36, head: "MOOGSOFT · CRITICAL · OLB", text: "HTTP 5xx error rate 38.4% (threshold 5%)"}
          - {at: d3@0.5, head: "MOOGSOFT · CRITICAL · MBL", text: "HTTP 5xx error rate 27.9% (threshold 5%)"}
          - {at: d3@0.66, head: "NIGHTWATCH · ENGAGED", text: "Grouping errors by app: 9 apps failing since 02:07:30", style: agent}
        errors:                               # `after` = seconds into the step when this app starts failing
          - {after: 1.0, tla: "OLB", messages: ["CIF profile response failed schema validation", "profile unavailable: upstream contract violation (502)"]}
          - {after: 2.6, tla: "MBL", messages: ["customer-profile-api: customerId missing from profile response (502)"]}
          - {after: 3.8, tla: "PAY", messages: ["Payment rejected: payer verification unavailable (502)", "Unrecognized field \"customer_id\" (class CustomerProfile)"]}
          - {after: 5.4, tla: "FRD", messages: ["customer feature extraction failed: KeyError 'customerId'"]}
          - {after: 6.2, tla: "NTF", messages: ["notification dropped: recipient resolution failed"]}
          - {after: 7.0, tla: "CRD", messages: ["NullPointerException: CustomerProfile.customerId() is null (500)"]}
          - {after: 7.8, tla: "TLR", messages: ["IllegalStateException: CIF returned profile for null (500)"]}
        background:                           # healthy traffic. {id} and {ms} are filled with random values
          - {tla: "CIF", message: "GET /v1/customers/C-{id}/profile 200 {ms}ms client_id=olb-bff"}
          - {tla: "DEP", message: "GET /v1/accounts/{id}/balances 200 {ms}ms"}
          - {tla: "ATH", message: "token issued grant=refresh_token"}
          - {tla: "CIF", message: "GET /v1/customers/C-{id}/profile 200 {ms}ms client_id=pay-api"}

      graph:
        app: ServiceNow · application dependency graph
        failing:
          - [OLB, Online Banking]
          - [MBL, Mobile Banking]
          - [PAY, Payments Hub]
          - [FRD, Fraud Scoring]
          - [NTF, Notifications]
          - [CRD, Card Management]
          - [TLR, Teller Platform]
          - [DEP, Deposit Accounts]
          - [BPY, Bill Pay]
        upstream: {tla: "CIF", name: "Customer Information File"}
        common: {at: d4@0.5, text: "COMMON UPSTREAM"}
        green: {at: d4@0.84, text: "200 OK · LOOKS GREEN"}
        notes: [9 failing apps, 187 callers of CIF]
        footer: "get_app_dependencies(direction: \"up\") for each failing app"

      suspect:
        app: GitLab · keybank/CIF00/customer-profile-api
        state: Merged
        when: 30 s before the first error
        pipeline: {at: d5@0.62, text: "Pipeline passed"}
        title: Adopt enterprise API naming standard (snake_case)
        diff:
          at: d5@0.3
          file: src/main/resources/application.yml
          removed: "property-naming-strategy: LOWER_CAMEL_CASE"
          added: "property-naming-strategy: SNAKE_CASE"
        effect:
          at: d5@0.48
          lines: ["Consumers expect [[\"customerId\"]]", "CIF now returns *\"customer_id\"* with 200 OK"]
        decoys:
          at: d5@0.7
          heading: Ruled out
          items:
            - {tla: "OLB", title: "Update profile error copy (DCR-482)", why: "Copy only, no logic."}
            - {tla: "ATH", title: "Bump jose 5.9.3 to 5.9.6", why: "Patch release, unrelated."}
        stamp: {at: d5@0.8, text: "Suspect"}

      incident:
        app: ServiceNow · incident
        number: INC0010204
        priority: P1 Critical
        state: In progress
        opened_by: opened by Incident Automation
        title: "Customer profile failures across OLB, MBL, PAY after CIF change"
        fields:
          - {label: "Application", value: "CIF · Customer Information File"}
          - {label: "Assignment group", value: "CIF Application Support", at: d6@0.3}
          - {label: "Contact type", value: "Monitoring"}
          - {label: "On call", value: "Kristin Streich", at: d6@0.3}
        children:
          - {at: d6@0.56, number: "INC0010205", via: "phone", text: "Denver Tech Center: Teller Workstation cannot look up customers"}
          - {at: d6@0.66, number: "INC0010206", via: "phone", text: "Seattle Capitol Hill: online and mobile banking won't load profiles"}
          - {at: d6@0.76, number: "INC0010207", via: "chat", text: "Buffalo Elmwood: unable to verify customers at the teller line"}

      channel:
        app: "Teams · Incident Response · #inc0010204-customer-profile-errors"
        members:
          - {at: d7@0.22, name: "Kristin Streich", why: "On-call primary, CIF Application Support"}
          - {at: d7@0.3, name: "Dominic Green", why: "On-call secondary, CIF Application Support"}
          - {at: d7@0.4, name: "Dana Whitfield", why: "NOC shift lead, incident commander"}
          - {at: d7@0.46, name: "Tom Okafor", why: "Major incident manager"}
          - {at: d7@0.54, name: "Harley Donnelly", why: "CIF developer, author of the change"}
        messages:                             # style: system = dashed notification, person = a human reply
          - {at: d7@0.12, from: "Incident Automation", text: "*P1 INC0010204.* Nine apps cannot read customer profiles. Root cause: a CIF merge switched its JSON to snake_case, so [[customerId]] is now [[customer_id]]. CIF itself returns 200. Fix MR is ready for review."}
          - {at: d7@0.72, style: system, text: "Notification to Kristin Streich: “You've been added to #inc0010204-customer-profile-errors as on-call support for CIF. Here's who else is in the channel…”"}
          - {at: d7@0.9, style: person, from: "Kristin Streich", text: "On it. Reviewing the fix now."}

      fix:
        app: GitLab · fix merge request · opened by the agent
        states: [Open, Merged]
        label: incident
        link: links INC0010204
        title: Revert CIF JSON naming to camelCase
        diff:
          file: src/main/resources/application.yml
          removed: "property-naming-strategy: SNAKE_CASE"
          added: "property-naming-strategy: LOWER_CAMEL_CASE"
        button: [Merge, Merged by a human ✓]
        cursor_at: d8@0.34                    # the cursor starts moving to the button
        merge_at: d8@0.5                      # the click
        metric: {label: "Errors per minute", value: "1240"}
        incident: INC0010204
        incident_states: [In progress, Resolved]
        closed_at: d8@0.86
        stamp: Case closed

      result:
        at: d9
        big: "02:48"                          # <- spoken too (d9: "under three minutes")
        text: from first error to a briefed team with a root cause
        versus: "Today's P1 average: *1 h 48 min* to resolve"

  # ------------------------------------------------------------------ path to production
  prod:
    chapter: Path to production
    narration:
      g1: The path to production runs on tools the bank already has.
      g2:
        text: "Google Gemini does the reasoning. It reads production through the GCP and Kibana MCP servers."
        say: "Google Gemini does the reasoning. It reads production through the G.C.P. and Kibana M.C.P. servers."
      g3:
        text: "The GitLab MCP server and the KeyBank Codebase Analyst give it the code and its change history."
        say: "The Git Lab M.C.P. server and the KeyBank Codebase Analyst give it the code and its change history."
      g4:
        text: "Microsoft Studio connects it to Teams and ServiceNow, so it works where the incident team already works."
        say: "Microsoft Studio connects it to Teams and Service Now, so it works where the incident team already works."
      g5: "We roll out in three phases. Shadow mode, where it only observes. Co-pilot, where a human approves each action. Then autonomy, for the patterns it has proven."
    screen:
      kicker: File 06 // Path to production
      headline: Built on the bank's own stack
      pipeline:                               # left to right. style: key = the highlighted box
        - {at: g2@0.5, tag: "Signals", title: "GCP + Kibana", sub: "GCP MCP, Kibana MCP"}
        - {at: g2, tag: "Agent", title: "Google Gemini", sub: "NightWatch's reasoning", style: key}
        - {at: g3, tag: "Code", title: "GitLab", sub: "GitLab MCP"}
        - {at: g3@0.4, tag: "Code knowledge", title: "KeyBank Codebase Analyst", sub: "What the code does, who changed it"}
        - {at: g4, tag: "People", title: "Microsoft Studio", sub: "Teams chat and calls"}
        - {at: g4@0.4, tag: "Record", title: "ServiceNow", sub: "Incidents, changes, problems"}
      guards:
        - {at: g4@0.6, name: "Human", text: "makes the final call"}
        - {at: g4@0.75, name: "No merge, no delete", text: "by design"}
        - {at: g4@0.9, name: "Every action", text: "written to the incident record"}
      phases:
        - {at: g5@0.2, tag: "PHASE 1", title: "Shadow", text: "Observes and drafts. Changes nothing."}
        - {at: g5@0.45, tag: "PHASE 2", title: "Co-pilot", text: "Acts once a human approves."}
        - {at: g5@0.74, tag: "PHASE 3", title: "Autonomy", text: "Runs the patterns it has proven."}

