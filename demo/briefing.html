<title>Operation Nightwatch Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Layout: a 16:9 "surveillance monitor" stage (1280x720, scaled to fit) over a transport bar.
   One deliberate dark look: night-shift ops room, amber signal light, manila case files. */
:root {
  color-scheme: dark;
  --room: #060a14;      /* page behind the monitor */
  --ink: #0b1222;       /* stage background */
  --ink-2: #121b31;     /* panels */
  --ink-3: #1b2744;     /* raised surfaces */
  --line: #2b3a5c;
  --text: #e7edf8;
  --muted: #93a3c1;
  --amber: #f2b441;     /* the agent / signal */
  --red: #ef5350;       /* failing */
  --green: #3dd6a3;     /* healthy */
  --blue: #7fb2ff;      /* info */
  --paper: #e9ddbc;     /* manila case file */
  --paper-ink: #2a2415;
  --stamp: #c8372d;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --type: "Special Elite", "Courier New", monospace;
}
html, body { height: 100%; }
body {
  background: var(--room); color: var(--text); font-family: var(--body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.player { max-width: min(1280px, calc((100vh - 170px) * 16 / 9)); min-width: min(100%, 320px); margin: 0 auto; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--ink); border: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
  background:
    radial-gradient(900px 500px at 78% 8%, rgba(242,180,65,.07), transparent 60%),
    linear-gradient(rgba(127,178,255,.035) 1px, transparent 1px) 0 0 / 100% 40px,
    linear-gradient(90deg, rgba(127,178,255,.035) 1px, transparent 1px) 0 0 / 40px 100%,
    var(--ink);
}
.player:fullscreen { max-width: none; background: #000; display: flex; flex-direction: column; justify-content: center; }
.player:fullscreen .screen { width: min(100vw, calc((100vh - 58px) * 16 / 9)); margin: 0 auto; border-radius: 0; }
.player:fullscreen .bar { width: min(100vw, calc((100vh - 58px) * 16 / 9)); margin: 0 auto; border-radius: 0; }

/* ---------- stage chrome ---------- */
.hud { position: absolute; left: 28px; right: 28px; top: 20px; display: flex; justify-content: space-between; font: 500 13px var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; z-index: 5; }
.hud b { color: var(--amber); font-weight: 600; }
.hud .rec::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 8px; animation: blink 1.6s steps(2) infinite; }
.corner { position: absolute; width: 22px; height: 22px; border: 2px solid rgba(242,180,65,.55); z-index: 5; }
.corner.tl { left: 12px; top: 12px; border-right: 0; border-bottom: 0; }
.corner.tr { right: 12px; top: 12px; border-left: 0; border-bottom: 0; }
.corner.bl { left: 12px; bottom: 12px; border-right: 0; border-top: 0; }
.corner.br { right: 12px; bottom: 12px; border-left: 0; border-top: 0; }
.caption { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 1040px; width: max-content; padding: 9px 18px; background: rgba(4,7,14,.82); border-radius: 4px; font: 500 21px/1.35 var(--body); text-align: center; text-wrap: balance; z-index: 6; opacity: 0; transition: opacity .2s; }
.caption.on { opacity: 1; }
.nocc .caption { display: none; }

.scene { position: absolute; inset: 0; padding: 66px 64px 112px; opacity: 0; visibility: hidden; transition: opacity .55s ease, visibility 0s .55s; }
.scene.active { opacity: 1; visibility: visible; transition: opacity .55s ease; }
.kicker { font: 600 14px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
h1, h2 { font-family: var(--display); text-transform: uppercase; margin: 0; line-height: .95; letter-spacing: .01em; text-wrap: balance; }
h2 { font-size: 54px; font-weight: 800; margin-top: 8px; }
.cue { opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .5s cubic-bezier(.2,.7,.2,1); }
.cue.on { opacity: 1; transform: none; }
.cue.fade { transform: none; }
.stamp { position: absolute; font: 400 44px var(--type); letter-spacing: .08em; text-transform: uppercase; color: var(--stamp); border: 5px solid var(--stamp); border-radius: 8px; padding: 12px 22px 4px; opacity: 0; transform: rotate(-9deg) scale(2.3); transition: opacity .14s, transform .26s cubic-bezier(.2,1.5,.4,1); mix-blend-mode: normal; background: rgba(200,55,45,.06); white-space: nowrap; z-index: 4; }
.stamp.on { opacity: .95; transform: rotate(-9deg) scale(1); }
.stamp.green { color: var(--green); border-color: var(--green); background: rgba(61,214,163,.07); }
.chip { display: inline-flex; align-items: center; gap: 8px; font: 500 14px var(--mono); padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--ink-2); color: var(--muted); white-space: nowrap; }
.pill { display: inline-block; font: 600 13px var(--mono); padding: 3px 9px; border-radius: 99px; letter-spacing: .04em; }
.pill.red { background: rgba(239,83,80,.16); color: var(--red); border: 1px solid rgba(239,83,80,.5); }
.pill.green { background: rgba(61,214,163,.14); color: var(--green); border: 1px solid rgba(61,214,163,.45); }
.pill.amber { background: rgba(242,180,65,.14); color: var(--amber); border: 1px solid rgba(242,180,65,.5); }
.pill.gray { background: var(--ink-3); color: var(--muted); border: 1px solid var(--line); }

/* ---------- scene: open ---------- */
.open { display: grid; grid-template-columns: 1fr 400px; gap: 40px; align-items: center; height: 100%; }
.open h1 { font-size: 132px; font-weight: 800; margin: 14px 0 22px; }
.open h1 span { color: var(--amber); }
.lede { font-size: 25px; line-height: 1.4; color: var(--text); max-width: 600px; margin: 0 0 26px; }
.verbs { display: flex; gap: 14px; }
.verbs span { font: 700 26px var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 8px 18px 6px; border: 2px solid var(--amber); color: var(--amber); border-radius: 4px; }
.radar { position: relative; width: 380px; height: 380px; border-radius: 50%; border: 2px solid rgba(242,180,65,.55);
  background: repeating-radial-gradient(circle, transparent 0 46px, rgba(242,180,65,.2) 46px 47px), radial-gradient(circle, rgba(242,180,65,.09), transparent 70%); }
.radar::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(242,180,65,.5), transparent 22%); animation: spin 4.5s linear infinite; }
.radar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(242,180,65,.28), rgba(242,180,65,.28)) 50% 0 / 1px 100% no-repeat, linear-gradient(rgba(242,180,65,.28), rgba(242,180,65,.28)) 0 50% / 100% 1px no-repeat; }
.blip { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(239,83,80,.7); animation: ping 2.2s ease-out infinite; }
[data-scene="open"] .stamp { left: 590px; top: 138px; }

/* ---------- scene: prob ---------- */
.prob { display: grid; grid-template-columns: 500px 1fr; gap: 48px; height: 100%; }
.bigclock { font: 600 92px/1 var(--mono); letter-spacing: -.02em; margin: 22px 0 6px; font-variant-numeric: tabular-nums; }
.sub { font-size: 20px; color: var(--muted); margin: 0; }
.alerts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.alert { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: rgba(239,83,80,.1); border: 1px solid rgba(239,83,80,.5); border-left-width: 5px; border-radius: 4px; font-size: 17px; }
.alert b { font: 600 13px var(--mono); letter-spacing: .1em; color: var(--red); }
.alert.major { background: rgba(242,180,65,.09); border-color: rgba(242,180,65,.5); }
.alert.major b { color: var(--amber); }
.where { font: 800 40px var(--display); text-transform: uppercase; color: var(--amber); margin-top: 22px; letter-spacing: .03em; }
.estate { position: relative; align-self: center; justify-self: center; }
.dots { position: relative; display: grid; grid-template-columns: repeat(25, 14px); gap: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 3px; background: #24304d; transition: background .3s, box-shadow .3s; }
.dots i.bad { background: var(--red); box-shadow: 0 0 12px rgba(239,83,80,.75); }
.dots i.culprit.lit { background: var(--green); box-shadow: 0 0 0 4px rgba(61,214,163,.25), 0 0 16px rgba(61,214,163,.8); }
.tag { position: absolute; font: 600 13px var(--mono); padding: 3px 8px; border-radius: 3px; background: var(--red); color: #fff; white-space: nowrap; transform: translate(-50%, -34px); opacity: 0; transition: opacity .3s; z-index: 2; }
.tag.on { opacity: 1; }
.tag.ok { background: var(--green); color: #05241a; transform: translate(-50%, 24px); }
.estate-legend { display: flex; gap: 26px; margin-top: 22px; font: 500 16px var(--mono); color: var(--muted); }
.estate-legend b { color: var(--text); font-size: 22px; font-variant-numeric: tabular-nums; }
.estate-legend .r b { color: var(--red); }

/* ---------- scene: now ---------- */
.now { display: grid; grid-template-columns: 1fr 320px; gap: 36px; margin-top: 22px; }
.relay { display: flex; flex-direction: column; gap: 9px; }
.leg { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 11px 18px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 5px; min-height: 58px; }
.leg .t { font: 600 24px var(--mono); color: var(--amber); font-variant-numeric: tabular-nums; }
.leg .what { font-size: 21px; font-weight: 500; }
.leg.bounce { border-color: rgba(239,83,80,.6); background: rgba(239,83,80,.09); }
.leg.bounce .t { color: var(--red); }
.elapsed { align-self: start; padding: 26px 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink-2); text-align: center; position: relative; }
.elapsed .lbl { font: 600 13px var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.elapsed .num { font: 600 84px/1.05 var(--mono); font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
.elapsed .unit { font: 500 14px var(--mono); color: var(--muted); }
.elapsed p { font-size: 18px; color: var(--text); margin: 18px 0 0; line-height: 1.4; }
.now-wrap .stamp { right: 54px; bottom: 150px; font-size: 34px; }

/* ---------- scene: cost (case file) ---------- */
.paper { position: relative; width: 1090px; margin: 30px auto 0; padding: 34px 46px 30px; background: var(--paper); color: var(--paper-ink); border-radius: 3px; transform: rotate(-1.1deg); box-shadow: 0 24px 60px rgba(0,0,0,.55), 14px 14px 0 -4px #cdbf98; font-family: var(--type); }
.paper header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--paper-ink); padding-bottom: 12px; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; }
.redact { display: inline-block; width: 130px; height: 17px; background: var(--paper-ink); vertical-align: -2px; margin: 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; margin: 30px 0 24px; }
.stat .n { font: 800 88px/1 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .n small { font-size: 44px; font-weight: 700; margin-left: 4px; }
.stat p { margin: 10px 0 0; font-size: 18px; line-height: 1.35; }
.typed { font-size: 20px; border-top: 1px dashed rgba(42,36,21,.5); padding-top: 16px; display: flex; justify-content: space-between; gap: 20px; }
.typed em { font-style: normal; opacity: .65; font-size: 15px; }
.paper .stamp { right: 56px; bottom: -40px; font-size: 40px; }

/* ---------- scene: impl ---------- */
.impl { display: grid; grid-template-columns: 250px 1fr; gap: 34px; margin-top: 22px; }
.badge { background: var(--paper); color: var(--paper-ink); border-radius: 8px; padding: 16px 18px 18px; font-family: var(--type); box-shadow: 0 16px 40px rgba(0,0,0,.5); align-self: start; }
.badge .top { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.avatar { position: relative; height: 150px; margin: 12px 0; background: #17213a; border-radius: 4px; overflow: hidden; }
.avatar::before { content: ""; position: absolute; left: 50%; top: 26px; width: 58px; height: 58px; margin-left: -29px; border-radius: 50%; background: var(--amber); }
.avatar::after { content: ""; position: absolute; left: 50%; top: 94px; width: 136px; height: 110px; margin-left: -68px; border-radius: 68px 68px 0 0; background: var(--amber); }
.badge h3 { font: 800 30px/1 var(--display); text-transform: uppercase; margin: 0 0 10px; letter-spacing: .02em; }
.badge dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 14px; }
.badge dt { opacity: .6; text-transform: uppercase; font-size: 12px; padding-top: 2px; }
.badge dd { margin: 0; }
.right { position: relative; min-height: 440px; }
.arch { display: grid; grid-template-columns: 230px 34px 250px 34px 1fr; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.col .hd { font: 600 12px var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.box { padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--ink-2); }
.box b { display: block; font-size: 19px; font-weight: 600; }
.box span { font: 400 13px var(--mono); color: var(--muted); }
.box.agent { border: 2px solid var(--amber); background: rgba(242,180,65,.08); text-align: center; padding: 26px 14px; }
.box.agent b { font: 800 30px var(--display); text-transform: uppercase; color: var(--amber); letter-spacing: .03em; }
.arrow { height: 2px; background: var(--amber); position: relative; opacity: .8; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -5px; border: 6px solid transparent; border-left-color: var(--amber); border-right: 0; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tools .box { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tools .box span { font-size: 15px; color: var(--amber); }
.flow { display: flex; gap: 5px; align-items: center; margin-top: 26px; white-space: nowrap; }
.flow .st { font: 700 17.5px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 9px 6px; border-radius: 4px; background: var(--ink-3); border: 1px solid var(--line); }
.flow .st.human { background: var(--amber); color: #1c1403; border-color: var(--amber); }
.flow .sep { color: var(--muted); font: 600 13px var(--mono); }
.note { margin-top: 14px; font: 500 15px var(--mono); color: var(--muted); }
.note b { color: var(--amber); }
.range { position: absolute; inset: 0; background: var(--ink); }
.range h3 { font: 800 34px var(--display); text-transform: uppercase; margin: 0 0 6px; }
.range p { font-size: 20px; color: var(--muted); margin: 0 0 24px; max-width: 760px; line-height: 1.4; }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.tile { padding: 22px 16px; border: 1px solid var(--line); border-radius: 5px; background: var(--ink-2); }
.tile b { display: block; font: 800 62px/1 var(--display); color: var(--amber); font-variant-numeric: tabular-nums; }
.tile span { font-size: 16.5px; color: var(--muted); }
.traps { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.traps .chip { font-size: 15.5px; padding: 8px 12px; color: var(--text); }

/* ---------- scene: demo ---------- */
.demo-head { display: flex; justify-content: space-between; align-items: flex-end; }
.demo-head h2 { font-size: 44px; }
.clockbox { text-align: right; }
.clockbox .lbl { font: 500 12px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.clockbox .num { font: 600 40px/1 var(--mono); color: var(--amber); font-variant-numeric: tabular-nums; }
.demo { display: grid; grid-template-columns: 218px 1fr; gap: 18px; margin-top: 14px; height: 446px; }
.rail { display: flex; flex-direction: column; gap: 7px; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--ink-2); color: var(--muted); font-size: 17px; font-weight: 500; transition: all .3s; }
.step i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 600 12px var(--mono); font-style: normal; }
.step.cur { border-color: var(--amber); color: var(--text); background: rgba(242,180,65,.1); }
.step.cur i { border-color: var(--amber); color: var(--amber); }
.step.done { color: var(--text); }
.step.done i { background: var(--green); border-color: var(--green); color: #05241a; }
.step.done i::before { content: "\2713"; }
.step.done i span { display: none; }
.rail .tagline { margin-top: auto; font: 500 11px/1.5 var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.console { position: relative; border: 1px solid var(--line); border-radius: 6px; background: #0a1020; overflow: hidden; display: flex; flex-direction: column; }
.console .titlebar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--ink-3); border-bottom: 1px solid var(--line); font: 500 13px var(--mono); color: var(--muted); height: 36px; flex: none; }
.console .titlebar b { color: var(--amber); font-weight: 600; }
.console .titlebar span { white-space: nowrap; }
.console .titlebar .call { margin-left: auto; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panels { position: relative; flex: 1; }
.panel { position: absolute; inset: 0; padding: 16px 18px; opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.panel.on { opacity: 1; visibility: visible; transition: opacity .4s; }
.app { font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.app::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--blue)); }
/* logs */
.hist { display: flex; align-items: flex-end; gap: 3px; height: 62px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.hist span { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.hist u { display: block; background: var(--red); }
.hist s { display: block; background: #3a4a70; }
.loglines { font: 400 14.5px/26px var(--mono); white-space: nowrap; overflow: hidden; height: 260px; }
.loglines div { display: grid; grid-template-columns: 104px 62px 46px 1fr; gap: 10px; overflow: hidden; }
.loglines .ts { color: #6f7fa0; } .loglines .ERROR { color: var(--red); font-weight: 600; } .loglines .INFO { color: var(--blue); }
.loglines .tla { color: var(--amber); } .loglines .lm { overflow: hidden; text-overflow: ellipsis; color: #cfd8ea; }
.loglines .e .lm { color: #ffd0cf; }
.logwrap { display: grid; grid-template-columns: minmax(0, 1fr) 318px; gap: 16px; }
.banners { display: flex; flex-direction: column; gap: 8px; }
.banner { padding: 9px 12px; border-radius: 5px; background: #2a0f14; border: 1px solid var(--red); font-size: 15px; line-height: 1.35; }
.banner b { display: block; font: 600 12px var(--mono); letter-spacing: .12em; color: var(--red); margin-bottom: 2px; }
.banner.agent { background: #241a05; border-color: var(--amber); }
.banner.agent b { color: var(--amber); }
/* graph */
.graph { width: 100%; height: 100%; }
.graph .n rect { fill: #2a0f14; stroke: var(--red); stroke-width: 1.5; }
.graph .n text { fill: var(--text); font: 600 17px var(--mono); text-anchor: middle; }
.graph .n text.s { fill: var(--muted); font: 400 10.5px var(--body); }
.graph .n { opacity: 0; transition: opacity .3s; } .graph .n.on { opacity: 1; }
.graph .edge { stroke: var(--amber); stroke-width: 1.6; fill: none; stroke-dasharray: 420; stroke-dashoffset: 420; transition: stroke-dashoffset .9s ease; opacity: .85; }
.graph .edge.on { stroke-dashoffset: 0; }
.graph .cif rect { fill: #0c2a22; stroke: var(--green); stroke-width: 2; }
.graph .cif text { fill: var(--text); font: 600 20px var(--mono); text-anchor: middle; }
.graph .cif text.s { fill: var(--green); font: 500 13px var(--mono); }
.graph .ring { fill: none; stroke: var(--amber); stroke-width: 3; stroke-dasharray: 8 6; opacity: 0; transition: opacity .4s; }
.graph .ring.on { opacity: 1; animation: march 1.2s linear infinite; }
.graph .lbl { fill: var(--amber); font: 600 15px var(--mono); letter-spacing: .12em; opacity: 0; transition: opacity .4s; }
.graph .lbl.on { opacity: 1; }
.graph .cap { fill: var(--muted); font: 500 13px var(--mono); }
/* merge request */
.mr { display: grid; grid-template-columns: 1fr 268px; gap: 18px; height: calc(100% - 26px); }
.card { border: 1px solid var(--line); border-radius: 5px; background: var(--ink-2); padding: 14px 16px; }
.card h4 { margin: 4px 0 8px; font-size: 22px; font-weight: 600; line-height: 1.25; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font: 400 13px var(--mono); color: var(--muted); }
.diff { margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; font: 400 14.5px/1.7 var(--mono); }
.diff .f { background: var(--ink-3); padding: 3px 12px; color: var(--muted); font-size: 12.5px; }

"s":72.03,"e":79.84,"text":"Once service is restored, the paperwork starts: the ServiceNow record, a problem record, and the post-incident summary."},"c1":{"s":81.49,"e":82.82,"text":"The numbers tell the story."},"c2":{"s":83.14,"e":90.43,"text":"Over the last three months, a priority one incident took an average of one hour and forty-eight minutes to resolve for the applications it hit."},"c3":{"s":90.75,"e":100.17,"text":"Priority two took close to three hours, and well over three for the application that caused it. Every one of those minutes costs the bank revenue and customers."},"i1":{"s":101.82,"e":103.08,"text":"Enter NightWatch."},"i2":{"s":103.4,"e":109.14,"text":"It watches the live log stream, the alert feeds, and new ServiceNow incidents around the clock."},"i3":{"s":109.46,"e":120.09,"text":"When something breaks, it starts the critical incident process on its own, with forty-nine tools across four systems: logs, ServiceNow, GitLab, and Teams."},"i4":{"s":120.41,"e":127.6,"text":"It scopes the damage, traces the dependency graph to a common cause, and finds the exact change that broke production."},"i5":{"s":127.92,"e":140.26,"text":"Then it opens the parent incident, attaches the related incidents as children, stands up the Teams chat with the right support people, and proposes a fix. A human always makes the final call."},"i6":{"s":140.58,"e":148.35,"text":"It keeps ServiceNow current, raises the change request, and once service is back, completes the resolution steps the process requires."},"i7":{"s":148.67,"e":159.07,"text":"To train it safely, we built an entire simulated bank: four hundred applications, twelve hundred people, and realistic failures with decoys planted along the way."},"d1":{"s":160.72,"e":161.75,"text":"Let's watch it work."},"d2":{"s":162.07,"e":167.66,"text":"A change has just shipped. Errors start in online banking, then mobile, then payments."},"d3":{"s":167.98,"e":173.4,"text":"Fifty-five seconds in, the first critical alert const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const pad = (n) => String(Math.floor(n)).padStart(2, '0');
const mmss = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const list = (v) => (Array.isArray(v) ? v : []);

// *highlight* and [[good]] marks from content.yaml
const rich = (s) => esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>').replace(/\[\[(.+?)\]\]/g, '<i>$1</i>');
const on = (o) => (o && o.at ? ` data-on="${esc(o.at)}"` : '');

// "p2" beat start · "p2.e" beat end · "p2@0.4" 40% through · any of them "+1.5" / "-0.3" seconds
function at(spec) {
  const m = /^([a-z]+\d+)(\.e)?(?:@([\d.]+))?([+-][\d.]+)?$/.exec(String(spec ?? '').trim());
  const b = m && B[m[1]];
  if (!b) return 1e9;
  let t = m[2] ? b.e : b.s;
  if (m[3]) t = b.s + (b.e - b.s) * parseFloat(m[3]);
  if (m[4]) t += parseFloat(m[4]);
  return t;
}

/* ================= per-scene setup + per-frame drawing ================= */
const SETUP = {
  prob(s, st) {
    const e = s.estate, total = +e.total || 400, rows = Math.ceil(total / COLS);
    const dots = $('#dots'), els = [];
    for (let i = 0; i < total; i++) { const d = document.createElement('i'); dots.appendChild(d); els.push(d); }
    const cell = (rowFrac, col) => Math.min(total - 1, Math.floor(rowFrac * (rows - 1)) * COLS + col);
    const culprit = cell(0.5, 12);
    els[culprit].classList.add('culprit');
    const spots = [[0.2, 5], [0.33, 19], [0.8, 3], [0.6, 21], [0.93, 15], [0.07, 13]];
    const badAt = new Map(), named = list(e.labelled).slice(0, spots.length);
    named.forEach((l, i) => badAt.set(cell(...spots[i]), at(l.at)));
    const r = rng(2026), [t0, t1] = list(e.spread).map(at), want = Math.min(+e.failing || 0, total - 1), rest = Math.max(1, want - named.length);
    let guard = 0;
    while (badAt.size < want && guard++ < 5000) {
      const i = Math.floor(r() * total);
      if (i !== culprit && !badAt.has(i)) badAt.set(i, t0 + ((badAt.size - named.length) / rest) * (t1 - t0));
    }
    const place = (i) => `left:${(i % COLS) * 22 + 7}px;top:${Math.floor(i / COLS) * 22 + 7}px`;
    named.forEach((l, i) => dots.insertAdjacentHTML('beforeend', `<span class="tag"${on(l)} style="${place(cell(...spots[i]))}">${esc(l.text)}</span>`));
    dots.insertAdjacentHTML('beforeend', `<span class="tag ok"${on(e.culprit)} style="${place(culprit)}">${esc(e.culprit.text)}</span>`);
    Object.assign(st, { els, badAt, culprit, litAt: at(e.culprit.at), t0: secs(s.clock.start), speed: +s.clock.speed || 1 });
  },
  now(s, st) {
    let total = 0;
    st.pts = list(s.steps).map((p) => { const m = secs(String(p.time).replace('+', '')); total = String(p.time).startsWith('+') ? total + m : m; return [at(p.at), total]; });
  },
  cost(s, st) {
    st.stats = list(s.stats).map((x, i) => ({ el: $(`[data-stat="${i}"]`), t: at(x.at), parts: String(x.value).split(/(\d[\d,]*(?:\.\d+)?)/).filter((p) => p !== '') }));
  },
  demo(s, st) {
    const steps = list(s.steps), b0 = steps[0].beats[0];
    st.steps = steps.map((x, i) => ({ ...x, s: at(x.beats[0]), e: i < steps.length - 1 ? at(steps[i + 1].beats[0]) : at(x.beats[1] + '.e') + 0.2 }));
    st.clock = list(s.clock).map(([spec, v]) => [at(spec), secs(v)]);
    st.stepEls = $$('.step', $('#rail'));
    // dependency graph
    const G = s.graph, apps = list(G.failing), b1 = steps[1].beats[0];
    const gap = apps.length > 1 ? 800 / (apps.length - 1) : 0, w = Math.min(88, Math.max(48, gap - 12));
    let h = '';
    apps.forEach(([tla, name], i) => {
      const x = apps.length > 1 ? 50 + i * gap : 450;
      h += `<path class="edge" data-on="${b1}@${(0.2 + i * 0.025).toFixed(3)}" d="M${x} 76 C ${x} 170, 450 150, 450 232"/>`;
      h += `<g class="n" data-on="${b1}+${(i * 0.07).toFixed(2)}"><rect x="${x - w / 2}" y="16" width="${w}" height="60" rx="5"/><text x="${x}" y="43">${esc(tla)}</text><text class="s" x="${x}" y="62">${esc(name)}</text></g>`;
    });
    h += `<g class="cif"><rect x="330" y="234" width="240" height="74" rx="6"/><text x="450" y="266">${esc(G.upstream.tla)}</text><text class="s" x="450" y="290" text-anchor="middle">${esc(G.upstream.name)}</text></g>`;
    h += `<rect class="ring"${on(G.common)} x="320" y="224" width="260" height="94" rx="10"/>`;
    h += `<text class="lbl"${on(G.common)} x="596" y="262">${esc(G.common.text)}</text><text class="lbl"${on(G.green)} x="596" y="286" style="fill:var(--green)">${esc(G.green.text)}</text>`;
    list(G.notes).forEach((n, i) => { h += `<text class="cap" x="20" y="${262 + i * 20}">${esc(n)}</text>`; });
    h += `<text class="cap" x="450" y="346" text-anchor="middle">${esc(G.footer)}</text>`;
    $('#graph').innerHTML = h;
    // log lines, in the order the apps start failing
    const L = s.logs, r = rng(7), pick = (a) => a[Math.floor(r() * a.length)], seen = new Set();
    const errs = list(L.errors).map((e) => ({ ...e, after: +e.after || 0 })), bg = list(L.background), base = secs(L.start_time);
    const fill = (m) => String(m).replace(/\{id\}/g, () => String(10000000 + Math.floor(r() * 89999999))).replace(/\{ms\}/g, () => String(6 + Math.floor(r() * 30)));
    st.logs = []; st.logT0 = at(b0); st.lastLogN = -1;
    for (let i = 0; i < 70; i++) {
      const tau = -3.2 + i * 0.4, live = errs.filter((e) => tau >= e.after), fresh = live.find((e) => !seen.has(e.tla));
      let row;
      if (fresh || (live.length && r() < 0.74)) { const e = fresh || pick(live); seen.add(e.tla); row = ['ERROR', e.tla, pick(list(e.messages))]; }
      else if (bg.length) { const b = pick(bg); row = ['INFO', b.tla, fill(b.message)]; }
      else continue;
      const sim = base + tau * 5, ms = pad(Math.floor(r() * 99)) + Math.floor(r() * 9);
      st.logs.push({ tau, sev: row[0], tla: row[1], msg: row[2], ts: `${pad(sim / 3600)}:${pad((sim / 60) % 60)}:${pad(sim % 60)}.${ms}` });
    }
    const hist = $('#hist'), hr = rng(11);
    for (let i = 0; i < 44; i++) hist.insertAdjacentHTML('beforeend', '<span><u></u><s></s></span>');
    st.hist = $$('span', hist).map((el, i) => ({ el, base: 10 + hr() * 8, err: i < 14 ? 0 : Math.min(42, (i - 13) * 5 + hr() * 8) }));
    const spark = $('#spark'), sr = rng(5);
    for (let i = 0; i < 26; i++) spark.insertAdjacentHTML('beforeend', '<span></span>');
    st.spark = $$('span', spark).map((el) => ({ el, h: 60 + sr() * 40 }));
    const F = s.fix, last = steps[steps.length - 1];
    Object.assign(st, { mergeAt: at(F.merge_at), closedAt: at(F.closed_at), drainEnd: at(last.beats[1] + '.e') - 0.6, peak: +String(F.metric.value).replace(/,/g, '') || 0 });
  },
};

const DRAW = {
  prob(t, sc, s, st) {
    const sim = st.t0 + (t - sc.s) * st.speed;
    $('#clk').textContent = `${pad((sim / 3600) % 24)}:${pad((sim / 60) % 60)}:${pad(sim % 60)}`;
    let n = 0;
    st.badAt.forEach((when, i) => { const bad = t >= when; if (bad) n++; st.els[i].classList.toggle('bad', bad); });
    st.els[st.culprit].classList.toggle('lit', t >= st.litAt);
    $('#failing').textContent = n;
  },
  now(t, sc, s, st) {
    let v = 0, prev = 0;
    for (const [a, target] of st.pts) { if (t >= a) v = prev + (target - prev) * ease((t - a) / 0.8); prev = target; }
    v = Math.round(v);
    $('#elapsed').textContent = `${pad(v / 60)}:${pad(v % 60)}`;
  },
  cost(t, sc, s, st) {
    for (const x of st.stats) {
      const k = ease((t - x.t) / 0.9);
      let nth = 0;
      x.el.innerHTML = x.parts.map((p) => {
        if (!/^\d/.test(p)) return `<small>${esc(p.trim())}</small>${/\s$/.test(p) ? ' ' : ''}`;
        const dec = (p.split('.')[1] || '').length, target = parseFloat(p.replace(/,/g, ''));
        let out = (target * k).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        if (nth++ > 0) out = out.padStart(p.length, '0');
        return out;
      }).join('');
    }
  },
  demo(t, sc, s, st) {
    const c = st.clock;
    let m = c.length ? c[c.length - 1][1] : 0;
    if (c.length && t <= c[0][0]) m = c[0][1];
    else for (let i = 1; i < c.length; i++) if (t <= c[i][0]) { const [a, va] = c[i - 1], [b, vb] = c[i]; m = va + (vb - va) * ((t - a) / (b - a || 1)); break; }
    $('#mclock').textContent = `${s.clock_prefix || ''}${pad(m / 60)}:${pad(m % 60)}`;
    let cur = -1;
    st.steps.forEach((x, i) => {
      const isCur = t >= x.s && t < x.e;
      if (isCur) cur = i;
      st.stepEls[i].classList.toggle('done', t >= x.e);
      st.stepEls[i].classList.toggle('cur', isCur);
    });
    $('#ctitle').textContent = cur < 0 ? (t < st.steps[0].s ? s.idle.before : s.idle.after) : st.steps[cur].status;
    $('#ccall').textContent = cur < 0 ? '' : st.steps[cur].calls;
    const tau = t - st.logT0, n = st.logs.filter((l) => l.tau <= tau).length;
    if (n !== st.lastLogN) {
      st.lastLogN = n;
      $('#logs').innerHTML = st.logs.slice(Math.max(0, n - 10), n).map((l) => `<div class="${l.sev === 'ERROR' ? 'e' : ''}"><span class="ts">${l.ts}</span><span class="${l.sev}">${l.sev}</span><span class="tla">${esc(l.tla)}</span><span class="lm">${esc(l.msg)}</span></div>`).join('');
    }
    const head = 14 + tau / 0.42;
    st.hist.forEach((h, i) => { const vis = clamp(head - i); h.el.firstChild.style.height = h.err * vis + 'px'; h.el.lastChild.style.height = h.base * (i < 14 ? 1 : vis) + 'px'; });
    const F = s.fix, f = 1 - ease((t - st.mergeAt - 0.15) / Math.max(0.5, st.drainEnd - st.mergeAt - 0.15)), clear = f < 0.08;
    st.spark.forEach((b) => { b.el.style.height = Math.max(2, b.h * f) + '%'; b.el.style.background = clear ? 'var(--green)' : ''; });
    $('#epm').textContent = Math.round(st.peak * f).toLocaleString('en-US');
    $('#epm').style.color = clear ? 'var(--green)' : 'var(--red)';
    const merged = t >= st.mergeAt, closed = t >= st.closedAt;
    $('#fixstate').textContent = F.states[merged ? 1 : 0]; $('#fixstate').className = 'pill ' + (merged ? 'green' : 'amber');
    $('#incstate').textContent = F.incident_states[closed ? 1 : 0]; $('#incstate').className = 'pill ' + (closed ? 'green' : 'amber');
  },
};

/* ================= build the stage ================= */
$('#hudL').innerHTML = rich(C.hud);
const scenes = TL.scenes.filter((s) => T[s.id] && C.scenes[s.id]).map((s) => {
  const el = document.createElement('section');
  el.className = 'scene' + (s.id === 'now' ? ' now-wrap' : '');
  el.dataset.scene = s.id;
  el.innerHTML = T[s.id](C.scenes[s.id]);
  $('#scenes').appendChild(el);
  return { ...s, el, content: C.scenes[s.id], state: {} };
});
scenes.forEach((sc) => SETUP[sc.id] && SETUP[sc.id](sc.content, sc.state));

const cues = $$('[data-on],[data-off]').map((el) => ({ el, on: el.dataset.on ? at(el.dataset.on) : -1, off: el.dataset.off ? at(el.dataset.off) : 1e9, st: null }));
const beatList = Object.values(B).sort((a, b) => a.s - b.s);
const cap = $('#cap'), stage = $('#stage'), hudR = $('#hudR');
let lastScene = null, lastCap = null;

function render(t) {
  let sc = scenes[scenes.length - 1];
  for (const s of scenes) if (t < s.e) { sc = s; break; }
  if (sc && sc !== lastScene) {
    scenes.forEach((s) => s.el.classList.toggle('active', s === sc));
    lastScene = sc;
    hudR.textContent = sc.title;
    $$('#chapters button').forEach((b, i) => b.classList.toggle('cur', scenes[i] === sc));
  }
  for (const c of cues) { const live = t >= c.on && t < c.off; if (live !== c.st) { c.st = live; c.el.classList.toggle('on', live); } }
  const beat = beatList.find((b) => t >= b.s - 0.12 && t < b.e + 0.3);
  if (beat !== lastCap) { lastCap = beat; cap.classList.toggle('on', !!beat); if (beat) cap.textContent = beat.text; }
  if (sc && DRAW[sc.id]) DRAW[sc.id](t, sc, sc.content, sc.state);
  seekEl.value = t; seekEl.style.setProperty('--p', (t / D) * 100 + '%');
  timeEl.textContent = `${mmss(t)} / ${mmss(D)}`;
}

/* ---------- clock: the voice-over is the master; a timer stands in if audio can't play ---------- */
const audio = $('#vo'), seekEl = $('#seek'), timeEl = $('#time'), poster = $('#poster'), bPlay = $('#bPlay');
let playing = false, fallback = false, fbBase = 0, fbStart = 0, shown = -1;
seekEl.max = D;
audio.addEventListener('error', () => { if (!fallback) { fallback = true; fbBase = 0; } });
const now = () => clamp(fallback ? (playing ? fbBase + (performance.now() - fbStart) / 1000 : fbBase) : audio.currentTime, 0, D);
function setPlaying(p) { playing = p; bPlay.textContent = p ? 'PAUSE' : 'PLAY'; bPlay.setAttribute('aria-label', p ? 'Pause' : 'Play'); if (p) poster.hidden = true; }
function useTimer() { fallback = true; fbBase = clamp(audio.currentTime || fbBase, 0, D); fbStart = performance.now(); setPlaying(true); }
function play() {
  if (now() >= D - 0.05) seek(0);
  if (fallback) { fbStart = performance.now(); setPlaying(true); return; }
  const p = audio.play();
  if (p && p.then) p.then(() => setPlaying(true)).catch(useTimer); else setPlaying(true);
}
function pause() { if (fallback) fbBase = now(); else audio.pause(); setPlaying(false); }
function seek(t) { t = clamp(t, 0, D); if (fallback) { fbBase = t; fbStart = performance.now(); } else { try { audio.currentTime = t; } catch (e) { fallback = true; fbBase = t; } } shown = -1; }
const toggle = () => (playing ? pause() : play());
function chapter(delta) { const i = scenes.indexOf(lastScene); const j = clamp(i + delta, 0, scenes.length - 1); seek(delta < 0 && now() - scenes[i].s > 2 ? scenes[i].s : scenes[j].s); }
audio.addEventListener('ended', () => setPlaying(false));

function frame() {
  const t = now();
  if (playing && t >= D - 0.02) { pause(); poster.hidden = false; $('#posterLbl').textContent = C.player.replay; }
  if (t !== shown) { shown = t; render(t); }
  requestAnimationFrame(frame);
}

/* ---------- transport ---------- */
const chapters = $('#chapters'), seekWrap = $('#seekWrap');
scenes.forEach((s, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${mmss(s.s)}</b>${esc(s.title)}`;
  b.onclick = () => { seek(s.s); if (!playing) play(); };
  chapters.appendChild(b);
  if (i) seekWrap.insertAdjacentHTML('beforeend', `<i class="tick" style="left:calc(${(s.s / D) * 100}% - 1px)"></i>`);
});
poster.onclick = play; bPlay.onclick = toggle;
$('#screen').addEventListener('click', (e) => { if (e.target.closest('.poster')) return; toggle(); });
seekEl.addEventListener('input', () => seek(parseFloat(seekEl.value)));
const bCC = $('#bCC'), bMute = $('#bMute'), player = $('#player');
function press(btn, state) { btn.setAttribute('aria-pressed', state); }
bCC.onclick = () => { const off = stage.classList.toggle('nocc'); press(bCC, !off); };
bMute.onclick = () => { audio.muted = !audio.muted; press(bMute, !audio.muted); };
$('#bFS').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (player.requestFullscreen) player.requestFullscreen().catch(() => {}); };
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea') && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'arrowright') seek(now() + 5);
  else if (k === 'arrowleft') seek(now() - 5);
  else if (k === 'n') chapter(1);
  else if (k === 'p') chapter(-1);
  else if (k === 'c') bCC.click();
  else if (k === 'm') bMute.click();
  else if (k === 'f') $('#bFS').click();
});
const fit = () => { stage.style.transform = `scale(${$('#screen').clientWidth / 1280})`; };
new ResizeObserver(fit).observe($('#screen')); fit();
// Used by render.py: jump to a time on the timer clock, without the audio element.
window.__seek = (t) => { fallback = true; seek(t); render(now()); };
// At rest the title card shows complete, behind the start button.
render(0);
if (scenes[0]) {
  $$('[data-on]', scenes[0].el).forEach((el) => el.classList.add('on'));
  cues.forEach((c) => { if (scenes[0].el.contains(c.el)) c.st = true; });
}
