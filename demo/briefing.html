<title>Operation Nightwatch Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a 16:9 stage (1280x720, scaled to fit) over a transport bar. Every scene sits in the
   same frame: a 44px file strip on top, the content, and a 100px caption band at the bottom.
   One deliberate light look: a printed case file. Paper, ink, hairlines; colour only for status
   (red failing, green healthy), a highlighter for *marked* words, and the odd red stamp.
   No glow, no gradients, nothing that moves unless it is the thing being explained. */
:root {
  color-scheme: light;
  --room: #e9e8e4;      /* page behind the stage */
  --paper: #f6f5f2;     /* stage background */
  --card: #ffffff;      /* sheets and boxes */
  --ink: #191919;       /* text, and NightWatch itself */
  --muted: #6c6b66;
  --line: #d8d6cf;      /* hairlines */
  --soft: #dfddd6;      /* idle squares in the estate grid */
  --red: #b42318;       /* failing, and stamps */
  --green: #1c7c4a;     /* healthy */
  --warn: #8f6200;      /* a "major" alert */
  --mark: #ffe27a;      /* highlighter */
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--room); color: var(--ink); font-family: var(--sans);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.player { max-width: min(1280px, calc((100vh - 170px) * 16 / 9)); min-width: min(100%, 320px); margin: 0 auto; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--paper); border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--paper); }
.player:fullscreen { max-width: none; background: #000; display: flex; flex-direction: column; justify-content: center; }
.player:fullscreen .screen { width: min(100vw, calc((100vh - 58px) * 16 / 9)); margin: 0 auto; }
.player:fullscreen .bar { width: min(100vw, calc((100vh - 58px) * 16 / 9)); margin: 0 auto; }

/* ---------- stage frame: file strip on top, caption band at the bottom ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: var(--paper); border-bottom: 1px solid var(--line); font: 500 12px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; z-index: 5; }
.hud span { display: inline-flex; align-items: center; gap: 10px; white-space: pre; }
.hud b { color: var(--ink); font-weight: 600; }
.hud .mark { flex: none; width: 20px; height: 20px; color: var(--ink); --blip: 4px; }
.capband { position: absolute; left: 0; right: 0; bottom: 0; height: 100px; display: grid; place-items: center; background: var(--card); border-top: 1px solid var(--line); z-index: 6; }
.caption { max-width: 1060px; font: 500 20px/1.35 var(--sans); text-align: center; text-wrap: balance; opacity: 0; transition: opacity .2s; }
.caption.on { opacity: 1; }
.nocc .capband { display: none; }

.scene { position: absolute; inset: 0; padding: 74px 64px 124px; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
.scene.active { opacity: 1; visibility: visible; transition: opacity .5s ease; }
.kicker { font: 500 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--sans); margin: 0; text-wrap: balance; }
h2 { font-size: 44px; font-weight: 600; line-height: 1.08; letter-spacing: -.025em; margin-top: 8px; }
.mark { display: block; }
/* The mark: a radar. Rings and cross-hairs in the current colour, a sweep that circles, and red
   blips that light as the sweep reaches them. The only thing here that moves by itself. */
.radar { position: relative; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; --blip: 10px; }
.radar::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .4;
  background:
    linear-gradient(currentColor, currentColor) 50% 0 / 1px 100% no-repeat,
    linear-gradient(currentColor, currentColor) 0 50% / 100% 1px no-repeat,
    radial-gradient(circle closest-side, transparent 0 33%, currentColor 33% calc(33% + 1px), transparent calc(33% + 1px) 66%, currentColor 66% calc(66% + 1px), transparent calc(66% + 1px)); }
.radar .sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 72%, color-mix(in srgb, currentColor 60%, transparent) 100%); animation: sweep 4.5s linear infinite; }
.radar .blip { position: absolute; width: var(--blip); height: var(--blip); margin: calc(var(--blip) / -2) 0 0 calc(var(--blip) / -2); border-radius: 50%; background: #e5484d; opacity: 0; animation: blip 4.5s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
@keyframes blip { 0% { opacity: 0; transform: scale(.4); } 2% { opacity: 1; transform: scale(1.5); } 8% { opacity: 1; transform: scale(1); } 60% { opacity: 0; transform: scale(1); } 100% { opacity: 0; } }
/* product logos in the diagrams */
.lg { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; }
.lg svg { display: block; width: 100%; height: 100%; }
.lg.lg-key, .node .lg.lg-key { width: 40px; height: 18px; }
/* *marked* words: an analyst's highlighter */
.hl b { font-weight: 600; color: var(--ink); background: var(--mark); padding: 1px 3px; margin: 0 -1px; }

.cue { opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
.cue.on { opacity: 1; transform: none; }
.cue.fade { transform: none; }
/* A redaction bar that slides off the words. Used for the few lines that are the point. */
.cue.rd { position: relative; transform: none; transition: opacity .12s; }
.cue.rd::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: right; transition: transform .5s cubic-bezier(.65,0,.2,1) .2s; }
.cue.rd.on::after { transform: scaleX(0); }
.stamp { position: absolute; font: 600 21px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--red); border: 2.5px solid var(--red); padding: 8px 14px 7px 16px; opacity: 0; transform: rotate(-4deg) scale(1.1); transition: opacity .18s, transform .22s ease-out; white-space: nowrap; z-index: 4; }
.stamp.on { opacity: 1; transform: rotate(-4deg); }
.chip { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--mono); padding: 5px 10px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); white-space: nowrap; }

/* ---------- scene: open ---------- */
.open { display: grid; grid-template-columns: 1fr 300px; gap: 40px; align-items: center; height: 100%; }
.open h1 { font-size: 124px; font-weight: 300; line-height: .96; letter-spacing: -.045em; margin: 18px 0 30px -6px; }
.open h1 span { font-weight: 700; }
.lede { font-size: 24px; line-height: 1.4; max-width: 640px; margin: 0 0 30px; }
.verbs { display: flex; }
.verbs span { font: 600 24px var(--sans); padding: 5px 24px 5px 0; margin-right: 24px; border-right: 1px solid var(--line); }
.verbs span:last-child { border-right: 0; }
.verbs i { font: 500 13px var(--mono); font-style: normal; color: var(--muted); margin-right: 10px; }
.emblem { width: 300px; height: 300px; color: var(--ink); display: grid; place-items: center; }
.emblem .mark { width: 280px; height: 280px; box-shadow: inset 0 0 0 2px currentColor; --blip: 13px; }
.emblem .radar .sweep { background: conic-gradient(from 0deg, transparent 0 68%, color-mix(in srgb, currentColor 34%, transparent) 100%); }
[data-scene="open"] .stamp { left: 660px; top: 120px; }

/* ---------- scene: prob ---------- */
.prob { display: grid; grid-template-columns: 500px 1fr; gap: 48px; height: 100%; }
.bigclock { font: 500 84px/1 var(--mono); letter-spacing: -.03em; margin: 20px 0 8px -3px; font-variant-numeric: tabular-nums; }
.sub { font-size: 20px; color: var(--muted); margin: 0; }
.alerts { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.alert { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--red); font-size: 17px; }
.alert b { font: 600 12px var(--mono); letter-spacing: .1em; color: var(--red); }
.alert.major { border-left-color: var(--warn); }
.alert.major b { color: var(--warn); }
.where { font: 600 34px var(--sans); letter-spacing: -.02em; margin-top: 24px; }
.estate { position: relative; align-self: center; justify-self: center; }
.dots { position: relative; display: grid; grid-template-columns: repeat(25, 14px); gap: 8px; }
.dots i { width: 14px; height: 14px; background: var(--soft); transition: background .3s; }
.dots i.bad { background: var(--red); }
.dots i.culprit.lit { background: var(--green); outline: 2px solid var(--green); outline-offset: 3px; }
.tag { position: absolute; font: 500 13px var(--mono); padding: 3px 8px; background: var(--ink); color: #fff; white-space: nowrap; transform: translate(-50%, -34px); opacity: 0; transition: opacity .3s; z-index: 2; }
.tag.on { opacity: 1; }
.tag.ok { background: var(--green); transform: translate(-50%, 26px); }
.estate-legend { display: flex; gap: 26px; align-items: baseline; margin-top: 24px; font: 500 15px var(--mono); color: var(--muted); }
.estate-legend b { color: var(--ink); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.estate-legend .r b { color: var(--red); }
.estate-legend .cue b { color: var(--green); }

/* ---------- scene: now ---------- */
.now { display: grid; grid-template-columns: 1fr 300px; gap: 36px; margin-top: 22px; }
.relay { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); }
.leg { display: grid; grid-template-columns: 150px 1fr auto; gap: 18px; align-items: center; padding: 8px 18px; min-height: 56px; border-bottom: 1px solid var(--line); }
.leg:last-child { border-bottom: 0; }
.leg .t { font: 500 21px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.leg .what { font-size: 20px; font-weight: 500; }
.leg .what span { display: block; }
.leg .what span + span { margin-top: 3px; }
.leg .what small { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 3px 0; }
h2 .p1 { display: inline-block; vertical-align: 7px; margin-right: 14px; padding: 5px 10px 4px; background: var(--red); color: #fff; font: 600 17px var(--mono); letter-spacing: .06em; }
.leg.bounce .t, .leg.bounce .what { color: var(--red); }
.elapsed { align-self: start; padding: 24px; border: 1px solid var(--line); background: var(--card); }
.elapsed .lbl { font: 500 12px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.elapsed .num { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 0 -3px; }
.elapsed .num b { font: 500 68px/1.05 var(--mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 1.25em; text-align: right; }
.elapsed .num span { font: 500 20px var(--sans); color: var(--muted); }
.elapsed p { font-size: 18px; font-weight: 500; color: var(--red); margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); line-height: 1.4; }
.now-wrap .stamp { right: 64px; bottom: 150px; }

/* ---------- scene: cost (one sheet from the file) ---------- */
.paper { position: relative; margin-top: 28px; padding: 28px 40px 30px; background: var(--card); border: 1px solid var(--line); }
.paper header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 14px; font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.redact { display: inline-block; width: 110px; height: 13px; background: var(--ink); vertical-align: -2px; margin: 0 10px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 40px 0 36px; }
.stat { padding-left: 28px; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat .n { font: 600 112px/1 var(--sans); letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .n small { font-size: 44px; font-weight: 500; letter-spacing: 0; margin-left: 3px; color: var(--muted); }
.stat p { margin: 14px 0 0; font: 500 19px var(--sans); color: var(--muted); }
.footnote { margin: 14px 2px 0; font: 400 14px var(--mono); color: var(--muted); }
.typed { font-size: 22px; font-weight: 500; border-top: 1px solid var(--line); padding-top: 24px; }
.paper .stamp { right: 36px; bottom: 24px; }

/* ---------- scene: impl (watch -> trigger -> orchestrator <-> sub-agents -> outcome) ---------- */
.orch { position: relative; height: 356px; margin-top: 22px; }
.orch > * { position: absolute; }
.orch svg.wires { left: 0; top: 0; width: 1152px; height: 356px; overflow: visible; }
.wires path { fill: none; stroke-width: 1.5; }
.wires .out { stroke: var(--ink); }
.wires .back { stroke: var(--green); }
.wires .trig { stroke: var(--red); stroke-width: 2; }
.watch { left: 0; top: 78px; width: 250px; height: 200px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); }
.watch .hd, .subs-hd { font: 500 12px var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.watch h3 { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 600; margin: 10px 0 2px; }
.watch p { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
.watch code { display: block; font: 400 13px/1.75 var(--mono); color: var(--muted); white-space: nowrap; }
.watch code.err { color: var(--red); font-weight: 600; }
.trigger { left: 262px; top: 134px; width: 116px; text-align: center; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.brain { left: 390px; top: 78px; width: 250px; height: 200px; padding: 22px 20px; background: var(--ink); color: #fff; display: flex; flex-direction: column; justify-content: center; }
.brain .mark { flex: none; width: 44px; height: 44px; margin-bottom: 14px; --blip: 5px; }
.brain b { font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.brain span { margin-top: 8px; font-size: 15px; line-height: 1.35; color: #b9b7b0; }
.subs-hd { left: 760px; top: 0; }
.sub-agent { left: 760px; width: 392px; height: 72px; padding: 0 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); }
.sub-agent b { display: block; font-size: 18px; font-weight: 600; }
.sub-agent span.d { font-size: 14px; color: var(--muted); }
.sub-agent .sys { display: flex; align-items: center; gap: 8px; font: 500 14px var(--sans); white-space: nowrap; }
.mcp { font: 600 10.5px var(--mono); letter-spacing: .1em; padding: 3px 6px 2px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); text-transform: uppercase; white-space: nowrap; }
.wire-key { left: 652px; width: 96px; text-align: center; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.wire-key.out { top: 22px; color: var(--ink); }
.wire-key.back { top: 322px; color: var(--green); }
.flow { display: flex; gap: 6px; align-items: center; margin-top: 18px; white-space: nowrap; }
.flow .lead { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 8px; }
.flow .st { font: 600 16px var(--sans); padding: 8px 12px; background: var(--card); border: 1px solid var(--line); }
.flow .st.human { background: var(--mark); border-color: var(--ink); }
.flow .sep { color: var(--muted); font: 500 13px var(--mono); }
/* ---------- scene: sim (the training ground) ---------- */
.arrow { height: 1.5px; background: var(--ink); position: relative; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4.5px; border: 5px solid transparent; border-left: 7px solid var(--ink); border-right: 0; }
.range { margin-top: 30px; }
.range p { font-size: 21px; color: var(--muted); margin: 0 0 28px; max-width: 820px; line-height: 1.45; }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border: 1px solid var(--line); }
.tile { padding: 26px 20px; border-left: 1px solid var(--line); }
.tile:first-child { border-left: 0; }
.tile b { display: block; font: 600 60px/1.05 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile span { font: 500 14px var(--mono); color: var(--muted); }
.traps { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.traps .chip { font: 500 17px var(--sans); padding: 9px 14px; color: var(--ink); background: var(--card); }

/* ---------- scene: demo (a recording of the real guided demo, cut to the narration) ---------- */
[data-scene="demo"] { padding: 0; }
.live { position: absolute; left: 0; top: 44px; width: 1280px; height: 576px; overflow: hidden; background: #fafafa; }
.live video, .live img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.live-tag { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: grid; place-items: center; font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); z-index: 6; pointer-events: none; }
[data-scene="demo"] .result { inset: 44px 0 100px; }
.result { position: absolute; inset: 0; z-index: 4; background: var(--paper); display: grid; place-items: center; text-align: center; }
.result .pre { font: 500 14px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 22px; }
.cuts { display: grid; grid-auto-flow: column; grid-auto-columns: 500px; }
.cut { padding: 6px 0; border-left: 1px solid var(--line); }
.cut:first-child { border-left: 0; }
.cut .nm { font: 600 22px var(--sans); }
.cut .big { font: 600 92px/1.1 var(--sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; white-space: nowrap; margin: 10px 0 12px; }
.cut .big small { font-size: .32em; font-weight: 500; letter-spacing: 0; color: var(--muted); margin: 0 .45em 0 .18em; }
.cut .big small:last-child { margin-right: 0; }
.cut .was { font: 500 17px var(--mono); color: var(--muted); }
.cut .was b { font-weight: 600; color: var(--ink); }
.cut .less { display: inline-block; margin-top: 16px; padding: 5px 12px; font: 600 17px var(--sans); color: var(--green); border: 1px solid var(--green); background: var(--card); }
.cut .yr { margin-top: 14px; font: 500 16px var(--mono); color: var(--muted); }
.cut .yr b { font-weight: 600; color: var(--ink); }
.year { display: inline-flex; align-items: baseline; gap: 12px; margin-top: 26px; padding: 14px 22px; background: var(--card); border: 1px solid var(--ink); border-left: 5px solid var(--green); font-size: 22px; font-weight: 500; }
.year small { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
.year b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.live-note { position: absolute; right: 18px; top: 9px; display: flex; align-items: center; gap: 6px; }
.live-note .lead { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.live-note .src { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; font: 500 14px var(--sans); background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.live-note .src .lg { width: 17px; height: 17px; }

/* ---------- scene: prod (everything connects to the agent) ---------- */
.hub { position: relative; height: 312px; margin-top: 22px; }
.hub > * { position: absolute; }
.hub svg.wires { left: 0; top: 0; width: 1152px; height: 312px; overflow: visible; }
.node { left: 0; width: 372px; height: 66px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); }
.node b { flex: 1; font-size: 18px; font-weight: 600; line-height: 1.15; }
.node .lg { width: 28px; height: 28px; }
.mcp.have { color: var(--green); border-color: var(--green); background: var(--card); }
.core { left: 456px; top: 66px; width: 240px; height: 180px; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.core .lg { width: 40px; height: 40px; margin-bottom: 12px; }
.core b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.core span { margin-top: 6px; font-size: 15px; color: #b9b7b0; }
.acts { left: 780px; top: 66px; width: 372px; height: 180px; padding: 18px 18px 0; background: var(--card); border: 1px solid var(--line); }
.acts .top { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.acts .top b { font-size: 18px; font-weight: 600; }
.acts .top .lg { width: 28px; height: 28px; }
.acts .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 17px; font-weight: 600; }
.acts .row span.d { font-weight: 400; font-size: 15px; color: var(--muted); white-space: nowrap; }
.hub .lbl { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ready { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 16px 20px; background: var(--card); border: 1px solid var(--ink); border-left: 5px solid var(--green); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.ready small { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--green); white-space: nowrap; }
.guards { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.guards .chip { font: 400 15px var(--sans); color: var(--muted); background: var(--card); padding: 7px 12px; }
.guards .chip b { color: var(--ink); font-weight: 600; }

/* ---------- scene: next ---------- */

nse is engaged and the critical incident communication goes out. Only then does the hunt for the cause really begin."},"n6":{"s":70.31,"e":74.38,"text":"On average, service is back an hour and eighteen minutes after it went down."},"c2":{"s":75.88,"e":82.46,"text":"Over the last three months, a priority one incident took an average of one hour and eighteen minutes to resolve."},"c3":{"s":82.76,"e":89.0,"text":"Priority two took well over three hours. Every one of those minutes costs the bank revenue and customers."},"i2":{"s":90.5,"e":95.81,"text":"NightWatch reads the production logs constantly, looking for a trigger: the first sign of an error."},"i3":{"s":96.11,"e":102.02,"text":"That trigger starts the orchestrator agent, which plans the investigation and sends out sub-agents."},"i4":{"s":102.32,"e":107.75,"text":"Each sub-agent asks one system for what it needs, through that system's MCP server."},"i5":{"s":108.05,"e":117.07,"text":"Their findings flow back up to the orchestrator. It names the cause, proposes the fix, and briefs the right people. A human makes the final call."},"i7":{"s":120.27,"e":129.11,"text":"To train it safely, we built a simulated bank: four hundred applications, twelve hundred people, and failures with decoys planted along the way."},"d1":{"s":130.61,"e":133.95,"text":"Let's watch it work, in a real run on the simulated bank."},"d2":{"s":135.35,"e":143.31,"text":"A change ships, and errors start to climb in the logs. NightWatch notices within seconds, before anyone is paged."},"d4":{"s":144.71,"e":150.22,"text":"It works out that every failing application is the same problem, and rates it priority one."},"d5":{"s":151.62,"e":158.93,"text":"It opens the parent incident in ServiceNow, assigned to the team that owns it. Help desk tickets about the same outage go underneath."},"d6":{"s":160.33,"e":167.24,"text":"It stands up the Teams chat, named for the incident, and brings in the right people. Each is told why they are there."},"d7":{"s":1 const logo = (k) => (LOGOS[k] ? `<span class="lg lg-${k}">${LOGOS[k]}</span>` : '');
// The NightWatch mark: a radar. The sweep circles; a blip lights up as the sweep passes it.
// `blips` are [angle in degrees clockwise from the top, distance from the centre 0..1].
const SWEEP = 4.5;
const mark = (blips = [[62, 0.55]]) => `<span class="mark radar" aria-hidden="true"><i class="sweep"></i>${blips.map(([deg, r]) => {
  const a = (deg - 90) * Math.PI / 180;
  return `<i class="blip" style="left:${(50 + Math.cos(a) * r * 50).toFixed(1)}%;top:${(50 + Math.sin(a) * r * 50).toFixed(1)}%;animation-delay:${((deg / 360 - 1) * SWEEP).toFixed(2)}s"></i>`;
}).join('')}</span>`;

/* ================= scene templates: content.yaml -> markup ================= */
const COLS = 25;
const DROP = 1.8;   // seconds the result numbers take to fall from today's figure to the estimate
const T = {
  open: (s) => `
    <div class="open"><div>
      <div class="kicker">${esc(s.kicker)}</div>
      <h1>${esc(s.title[0])}<br><span>${esc(s.title[1])}</span></h1>
      <p class="lede cue"${on(s.lede)}>${rich(s.lede.text)}</p>
      <div class="verbs">${list(s.verbs).map((v, i) => `<span class="cue rd"${on(v)}><i>${pad(i + 1)}</i>${esc(v.text)}</span>`).join('')}</div>
    </div>
    <div class="emblem">${mark([[48, 0.62], [128, 0.4], [205, 0.74], [292, 0.5]])}</div></div>
    ${stamp(s.stamp)}`,

  prob: (s) => `
    <div class="prob"><div>
      <div class="kicker">${esc(s.kicker)}</div>
      <div class="bigclock" id="clk">${esc(s.clock.start)}</div>
      <p class="sub">${esc(s.sub)}</p>
      <div class="alerts">${list(s.alerts).map((a) => `<div class="alert${/crit/i.test(a.level) ? '' : ' major'} cue"${on(a)}><b>${esc(a.level)}</b><span>${esc(a.text)}</span></div>`).join('')}</div>
      <div class="where cue"${on(s.question)}>${esc(s.question.text)}</div>
    </div>
    <div class="estate">
      <div class="dots" id="dots"></div>
      <div class="estate-legend">
        <span><b>${esc(s.estate.total)}</b> ${esc(s.estate.legend.total)}</span>
        <span class="r"><b id="failing">0</b> ${esc(s.estate.legend.failing)}</span>
        <span class="cue fade"${on(s.estate.culprit)}>${rich(s.estate.legend.cause)}</span>
      </div>
    </div></div>`,

  now: (s) => `
    ${heading(s)}
    <div class="now">
      <div class="relay">${list(s.steps).map((p) => `<div class="leg${p.style === 'bounce' ? ' bounce' : ''} cue"${on(p)}><span class="t">${esc(hmin(secs(String(p.time).replace('+', ''))))}</span><span class="what"><span>${esc(p.text)}</span>${p.also ? `${p.joiner ? `<small>${esc(p.joiner)}</small>` : ''}<span>${esc(p.also)}</span>` : ''}</span><span class="chip">${esc(p.tool)}</span></div>`).join('')}</div>
      <div class="elapsed cue fade"${on(s.elapsed)}>
        <div class="lbl">${esc(s.elapsed.label)}</div><div class="num"><b id="elapsed-h">0</b><span id="elapsed-hu">hours</span></div><div class="num"><b id="elapsed-m">0</b><span id="elapsed-mu">minutes</span></div>
        <p class="cue fade"${on(s.elapsed.note)}>${esc(s.elapsed.note.text)}</p>
      </div>
    </div>
    ${stamp(s.stamp)}`,

  cost: (s) => `
    <div class="kicker">${esc(s.kicker)}</div>
    <div class="paper">
      <header><span>Subject:<i class="redact"></i>${esc(s.subject)}</span><span>${esc(s.exhibit)}</span></header>
      <div class="stats" style="grid-template-columns:repeat(${list(s.stats).length},1fr)">${list(s.stats).map((x, i) => `<div class="stat cue"${on(x)}><div class="n" data-stat="${i}"></div><p>${esc(x.label)}</p></div>`).join('')}</div>
      <div class="typed cue fade"${on(s.line)}><span>${esc(s.line.text)}</span></div>
      ${stamp(s.stamp)}
    </div>
    ${s.footnote ? `<p class="footnote cue fade"${on(s.footnote)}>${esc(s.footnote.text)}</p>` : ''}`,

  impl: (s) => {
    // Sub-agent rows sit on the right; each is wired to the orchestrator twice: the request going
    // out (ink) and the findings coming back (green).
    const rows = list(s.subagents.items), top = (i) => 26 + i * 84, mid = (i) => top(i) + 36;
    const fan = (i) => 178 + (i - (rows.length - 1) / 2) * 16;   // where each wire leaves the orchestrator
    const head = (x, y, dir, cls) => `<path class="${cls}" style="fill:currentColor;stroke:none" d="M${x} ${y}l${-9 * dir} -4.5v9z"/>`;
    const wires = rows.map((x, i) => {
      const y0 = fan(i), y1 = mid(i);
      const out = `M640 ${y0 - 4}C700 ${y0 - 4} 700 ${y1 - 5} 752 ${y1 - 5}`;
      const back = `M760 ${y1 + 5}C700 ${y1 + 5} 700 ${y0 + 4} 649 ${y0 + 4}`;
      return `<g class="cue fade" style="color:var(--ink)"${on(x)} data-lag="0.25"><path class="out" d="${out}"/>${head(760, y1 - 5, 1, 'out')}</g>
        <g class="cue fade" style="color:var(--green)" data-on="${esc(x.back_at)}"><path class="back" d="${back}"/>${head(640, y0 + 4, -1, 'back')}</g>`;
    }).join('');
    return `
    ${heading(s)}
    <div class="orch">
      <svg class="wires" viewBox="0 0 1152 356" aria-hidden="true">
        <g class="cue fade" style="color:var(--red)"${on(s.trigger)}><path class="trig" d="M250 178H380"/>${head(390, 178, 1, 'trig')}</g>
        ${wires}
      </svg>
      <div class="watch cue"${on(s.watch)}>
        <div class="hd">${esc(s.watch.heading)}</div>
        <h3>${logo(s.watch.logo)}${esc(s.watch.title)}</h3><p>${esc(s.watch.sub)}</p>
        ${list(s.watch.lines).map((l) => `<code>${esc(l)}</code>`).join('')}
        <code class="err cue fade"${on(s.watch.error)}>${esc(s.watch.error.text)}</code>
      </div>
      <div class="trigger cue fade"${on(s.trigger)}>${esc(s.trigger.text)}</div>
      <div class="brain cue"${on(s.agent)}>${mark()}<b>${esc(s.agent.title)}</b><span>${esc(s.agent.sub)}</span></div>
      <div class="subs-hd cue fade"${on(s.subagents)}>${esc(s.subagents.heading)}</div>
      ${rows.map((x, i) => `<div class="sub-agent cue" style="top:${top(i)}px"${on(x)}><div><b>${esc(x.name)}</b><span class="d">${esc(x.gets)}</span></div><div class="sys">${logo(x.logo)}${esc(x.system)}<span class="mcp">${esc(x.via || 'MCP')}</span></div></div>`).join('')}
      <div class="wire-key out cue fade"${on(rows[0])}>${esc(s.subagents.ask)} &rarr;</div>
      <div class="wire-key back cue fade" data-on="${esc(rows[0] ? rows[0].back_at : '')}">&larr; ${esc(s.subagents.answer)}</div>
    </div>
    <div class="flow"><span class="lead cue fade"${on(list(s.flow)[0])}>${esc(s.flow_lead)}</span>${list(s.flow).map((x, i) => `${i ? `<span class="sep cue fade"${on(x)}>&rarr;</span>` : ''}<span class="st${x.style === 'human' ? ' human' : ''} cue"${on(x)}>${esc(x.text)}</span>`).join('')}</div>`;
  },

  sim: (s) => `
    ${heading(s)}
    <div class="range">
      <p>${esc(s.text)}</p>
      <div class="tiles" style="grid-template-columns:repeat(${list(s.tiles).length},1fr)">${list(s.tiles).map((x) => `<div class="tile cue"${on(x)}><b>${esc(x.value)}</b><span>${esc(x.label)}</span></div>`).join('')}</div>
      <div class="traps cue"${on(s.chips)}>${list(s.chips.items).map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>
    </div>`,

  demo: (s) => {
    const R = s.result;
    // Notes sit in the empty right half of the recorded page's header: where a fact comes from.
    const notes = list(s.live.notes).map((n) => `<div class="live-note cue fade"${on(n)}${n.off ? ` data-off="${esc(n.off)}"` : ''}><span class="lead">${esc(n.lead)}</span>${list(n.items).map((x) => `<span class="src">${logo(x.logo)}${esc(x.text)}</span>`).join('')}</div>`).join('');
    return `
    <div class="live"><video id="live" src="${esc(s.live.video)}" muted playsinline preload="auto"></video><img id="liveimg" alt="" hidden>${notes}</div>
    <div class="live-tag">${esc(s.live.tag)}</div>
    <div class="result cue fade"${on(R)}><div>
      <div class="pre">${esc(R.label)}</div>
      <div class="cuts">${list(R.items).map((x, i) => `<div class="cut"><div class="nm">${esc(x.name)}</div><div class="big" data-cut="${i}"></div><div class="was">${esc(R.today)} <b>${esc(hmin(secs(x.from)))}</b></div><div class="less cue fade" data-on="${esc(R.drop_at)}" data-lag="${DROP}">${esc(R.text)}</div>${R.year && x.per_year ? `<div class="yr cue fade"${on(R.year)}>${esc(x.per_year)} &rarr; <b>${esc(x.saved)}</b></div>` : ''}</div>`).join('')}</div>
      ${R.year ? `<div class="year cue" data-on="${esc(R.year.total_at)}"><small>${esc(R.year.label)}</small><b>${esc(R.year.total)}</b> ${esc(R.year.text)}</div>` : ''}
    </div></div>`;
  },

  prod: (s) => {
    // Everything connects to the agent: what it reads on the left (arrows in), where it acts on
    // the right (arrow out).
    const src = list(s.reads), top = (i) => i * 82, mid = (i) => top(i) + 33;
    const head = (x, y) => `<path style="fill:var(--ink)" d="M${x} ${y}l-9 -4.5v9z"/>`;
    const fan = (i) => 156 + (i - (src.length - 1) / 2) * 18;
    return `
    ${heading(s)}
    <div class="hub">
      <svg class="wires" viewBox="0 0 1152 312" aria-hidden="true">
        ${src.map((x, i) => `<g class="cue fade"${after(x, s.agent)}><path class="out" d="M372 ${mid(i)}C420 ${mid(i)} 410 ${fan(i)} 447 ${fan(i)}"/>${head(456, fan(i))}</g>`).join('')}
        <g class="cue fade"${after(s.acts, s.agent)}><path class="out" d="M696 156H771"/>${head(780, 156)}</g>
      </svg>
      ${src.map((x, i) => `<div class="node cue" style="top:${top(i)}px"${on(x)}>${logo(x.logo)}<b>${esc(x.name)}</b><span class="mcp${x.style === 'have' ? ' have' : ''}">${esc(x.badge)}</span></div>`).join('')}
      <div class="core cue"${on(s.agent)}>${logo(s.agent.logo)}<b>${esc(s.agent.title)}</b><span>${esc(s.agent.sub)}</span></div>
      <div class="lbl cue fade" style="left:384px;top:6px;width:70px;text-align:center"${after(src[0], s.agent)}>${esc(s.reads_label)}</div>
      <div class="lbl cue fade" style="left:703px;top:128px;width:70px;text-align:center"${after(s.acts, s.agent)}>${esc(s.acts_label)}</div>
      <div class="acts cue"${on(s.acts)}>
        <div class="top">${logo(s.acts.logo)}<b>${esc(s.acts.name)}</b></div>
        ${list(s.acts.items).map((x) => `<div class="row">${logo(x.logo)}${esc(x.name)}<span class="d">${esc(x.text)}</span></div>`).join('')}
      </div>
    </div>
    <div class="ready cue"${on(s.ready)}><small>${esc(s.ready.tag)}</small>${esc(s.ready.text)}</div>
    <div class="guards">${list(s.guards).map((g) => `<span class="chip cue"${on(g)}><b>${esc(g.name)}</b> ${esc(g.text)}</span>`).join('')}</div>`;
  },

  next: (s) => `
    ${heading(s)}
    <div class="missions" style="grid-template-columns:repeat(${list(s.items).length},1fr)">${list(s.items).map((m, i) => `<div class="mission cue"${on(m)}><i>${pad(i + 1)}</i><b>${esc(m.title)}</b><span>${esc(m.text)}</span></div>`).join('')}</div>
    ${s.also ? `<div class="also hl cue fade"${on(s.also)}>${rich(s.also.text)}</div>` : ''}`,

  end: (s) => `
    <div class="end">
      <div class="kicker">${esc(s.kicker)}</div>
      <h1>${esc(s.title[0])} <span>${esc(s.title[1])}</span></h1>
      <div class="outcomes">${list(s.outcomes).map((o) => `<span class="cue rd"${on(o)}>${esc(o.text)}</span>`).join('')}</div>
      <p class="cue fade"${on(s.line)}>${esc(s.line.text)}</p>
      ${stamp(s.stamp)}
    </div>`,
};

/* ================= per-scene setup + per-frame drawing ================= */
const SETUP = {
  prob(s, st) {
    const e = s.estate, total = +e.total || 400, rows = Math.ceil(total / COLS);
    const dots = $('#dots'), els = [];
    for (let i = 0; i < total; i++) { const d = document.createElement('i'); dots.appendChild(d); els.push(d); }
    const cell = (rowFrac, col) => Math.min(total - 1, Math.floor(rowFrac * (rows - 1)) * COLS + col);
    const culprit = cell(0.5, 12);
    els[culprit].classList.add('culprit');
    const spots = [[0.2, 5], [0.33, 19], [0.8, 3], [0.6, 21], [0.93, 15], [0.07, 13]];
    const badAt = new Map(), named = list(e.labelled).slice(0, spots.length);
    named.forEach((l, i) => badAt.set(cell(...spots[i]), at(l.at)));
    const r = rng(2026), [t0, t1] = list(e.spread).map(at), want = Math.min(+e.failing || 0, total - 1), rest = Math.max(1, want - named.length);
    let guard = 0;
    while (badAt.size < want && guard++ < 5000) {
      const i = Math.floor(r() * total);
      if (i !== culprit && !badAt.has(i)) badAt.set(i, t0 + ((badAt.size - named.length) / rest) * (t1 - t0));
    }
    const place = (i) => `left:${(i % COLS) * 22 + 7}px;top:${Math.floor(i / COLS) * 22 + 7}px`;
    named.forEach((l, i) => dots.insertAdjacentHTML('beforeend', `<span class="tag"${on(l)} style="${place(cell(...spots[i]))}">${esc(l.text)}</span>`));
    dots.insertAdjacentHTML('beforeend', `<span class="tag ok"${on(e.culprit)} style="${place(culprit)}">${esc(e.culprit.text)}</span>`);
    Object.assign(st, { els, badAt, culprit, litAt: at(e.culprit.at), t0: secs(s.clock.start), speed: +s.clock.speed || 1 });
  },
  now(s, st) {
    let total = 0;
    st.pts = list(s.steps).map((p) => { const m = secs(String(p.time).replace('+', '')); total = String(p.time).startsWith('+') ? total + m : m; return [at(p.at), total]; });
  },
  cost(s, st) {
    st.stats = list(s.stats).map((x, i) => ({ el: $(`[data-stat="${i}"]`), t: at(x.at), parts: String(x.value).split(/(\d[\d,]*(?:\.\d+)?)/).filter((p) => p !== '') }));
  },
  demo(s, st) {
    st.v = $('#live'); st.img = $('#liveimg');
    st.dropAt = at(s.result.drop_at);
    st.cuts = list(s.result.items).map((x, i) => ({ el: $(`[data-cut="${i}"]`), from: secs(x.from), to: secs(x.to), shown: null }));
  },
};

const DRAW = {
  prob(t, sc, s, st) {
    const sim = st.t0 + (t - sc.s) * st.speed;
    $('#clk').textContent = `${pad((sim / 3600) % 24)}:${pad((sim / 60) % 60)}:${pad(sim % 60)}`;
    let n = 0;
    st.badAt.forEach((when, i) => { const bad = t >= when; if (bad) n++; st.els[i].classList.toggle('bad', bad); });
    st.els[st.culprit].classList.toggle('lit', t >= st.litAt);
    $('#failing').textContent = n;
  },
  now(t, sc, s, st) {
    let v = 0, prev = 0;
    for (const [a, target] of st.pts) { if (t >= a) v = prev + (target - prev) * ease((t - a) / 0.8); prev = target; }
    v = Math.round(v);
    const h = Math.floor(v / 60), m = v % 60;
    $('#elapsed-h').textContent = h; $('#elapsed-hu').textContent = h === 1 ? 'hour' : 'hours';
    $('#elapsed-m').textContent = m; $('#elapsed-mu').textContent = m === 1 ? 'minute' : 'minutes';
  },
  cost(t, sc, s, st) {
    for (const x of st.stats) {
      const k = ease((t - x.t) / 0.9);
      let nth = 0;
      x.el.innerHTML = x.parts.map((p) => {
        if (!/^\d/.test(p)) return `<small>${esc(p.trim())}</small>${/\s$/.test(p) ? ' ' : ''}`;
        const dec = (p.split('.')[1] || '').length, target = parseFloat(p.replace(/,/g, ''));
        let out = (target * k).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        if (nth++ > 0) out = out.padStart(p.length, '0');
        return out;
      }).join('');
    }
  },
  demo(t, sc, s, st) {
    // The result: each figure starts at today's average and falls to the estimate.
    const k = ease((t - st.dropAt) / DROP);
    for (const c of st.cuts) { const v = Math.round(c.from + (c.to - c.from) * k); if (v !== c.shown) { c.shown = v; c.el.innerHTML = units(hmin(v)); } }
    // The clip starts with the scene and is exactly as long as it.
    const v = st.v, target = Math.max(0, t - sc.s);
    if (window.__liveFrame) { v.hidden = true; st.img.hidden = false; window.__liveFrame(st.img, target); return; }   // render.py
    if (Math.abs(v.currentTime - target) > 0.35) { try { v.currentTime = target; } catch (e) {} }
    if (playing && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    else if (!playing && !v.paused) v.pause();
  },
};

/* ================= build the stage ================= */
$('#hudL').innerHTML = mark() + rich(C.hud);
const scenes = TL.scenes.filter((s) => T[s.id] && C.scenes[s.id]).map((s) => {
  const el = document.createElement('section');
  el.className = 'scene' + (s.id === 'now' ? ' now-wrap' : '');
  el.dataset.scene = s.id;
  el.innerHTML = T[s.id](C.scenes[s.id]);
  $('#scenes').appendChild(el);
  return { ...s, el, content: C.scenes[s.id], state: {} };
});
scenes.forEach((sc) => SETUP[sc.id] && SETUP[sc.id](sc.content, sc.state));

const cues = $$('[data-on],[data-off]').map((el) => ({ el, on: el.dataset.on ? Math.max(...el.dataset.on.split('|').map(at)) + (parseFloat(el.dataset.lag) || 0) : -1, off: el.dataset.off ? at(el.dataset.off) : 1e9, st: null }));
const beatList = Object.values(B).sort((a, b) => a.s - b.s);
const cap = $('#cap'), stage = $('#stage'), hudR = $('#hudR');
let lastScene = null, lastCap = null;

function render(t) {
  let sc = scenes[scenes.length - 1];
  for (const s of scenes) if (t < s.e) { sc = s; break; }
  if (sc && sc !== lastScene) {
    scenes.forEach((s) => s.el.classList.toggle('active', s === sc));
    lastScene = sc;
    hudR.textContent = `${pad(scenes.indexOf(sc) + 1)} / ${pad(scenes.length)}  ·  ${sc.title}`;
    $$('#chapters button').forEach((b, i) => b.classList.toggle('cur', scenes[i] === sc));
  }
  for (const c of cues) { const live = t >= c.on && t < c.off; if (live !== c.st) { c.st = live; c.el.classList.toggle('on', live); } }
  const beat = beatList.find((b) => t >= b.s - 0.12 && t < b.e + 0.3);
  if (beat !== lastCap) { lastCap = beat; cap.classList.toggle('on', !!beat); if (beat) cap.textContent = beat.text; }
  if (sc && DRAW[sc.id]) DRAW[sc.id](t, sc, sc.content, sc.state);
  if (sc && sc.id !== 'demo') { const v = $('#live'); if (v && !v.paused) v.pause(); }
  seekEl.value = t; seekEl.style.setProperty('--p', (t / D) * 100 + '%');
  timeEl.textContent = `${mmss(t)} / ${mmss(D)}`;
}

/* ---------- clock: the voice-over is the master; a timer stands in if audio can't play ---------- */
const audio = $('#vo'), seekEl = $('#seek'), timeEl = $('#time'), poster = $('#poster'), bPlay = $('#bPlay');
let playing = false, fallback = false, fbBase = 0, fbStart = 0, shown = -1;
seekEl.max = D;
audio.addEventListener('error', () => { if (!fallback) { fallback = true; fbBase = 0; } });
const now = () => clamp(fallback ? (playing ? fbBase + (performance.now() - fbStart) / 1000 : fbBase) : audio.currentTime, 0, D);
function setPlaying(p) { playing = p; bPlay.textContent = p ? 'PAUSE' : 'PLAY'; bPlay.setAttribute('aria-label', p ? 'Pause' : 'Play'); if (p) poster.hidden = true; }
function useTimer() { fallback = true; fbBase = clamp(audio.currentTime || fbBase, 0, D); fbStart = performance.now(); setPlaying(true); }
function play() {
  if (now() >= D - 0.05) seek(0);
  if (fallback) { fbStart = performance.now(); setPlaying(true); return; }
  const p = audio.play();
  if (p && p.then) p.then(() => setPlaying(true)).catch(useTimer); else setPlaying(true);
}
function pause() { if (fallback) fbBase = now(); else audio.pause(); setPlaying(false); }
function seek(t) { t = clamp(t, 0, D); if (fallback) { fbBase = t; fbStart = performance.now(); } else { try { audio.currentTime = t; } catch (e) { fallback = true; fbBase = t; } } shown = -1; }
const toggle = () => (playing ? pause() : play());
function chapter(delta) { const i = scenes.indexOf(lastScene); const j = clamp(i + delta, 0, scenes.length - 1); seek(delta < 0 && now() - scenes[i].s > 2 ? scenes[i].s : scenes[j].s); }
audio.addEventListener('ended', () => setPlaying(false));

function frame() {
  const t = now();
  if (playing && t >= D - 0.02) { pause(); poster.hidden = false; $('#posterLbl').textContent = C.player.replay; }
  if (t !== shown) { shown = t; render(t); }
  requestAnimationFrame(frame);
}

/* ---------- transport ---------- */
const chapters = $('#chapters'), seekWrap = $('#seekWrap');
scenes.forEach((s, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${mmss(s.s)}</b>${esc(s.title)}`;
  b.onclick = () => { seek(s.s); if (!playing) play(); };
  chapters.appendChild(b);
  if (i) seekWrap.insertAdjacentHTML('beforeend', `<i class="tick" style="left:calc(${(s.s / D) * 100}% - 1px)"></i>`);
});
poster.onclick = play; bPlay.onclick = toggle;
$('#screen').addEventListener('click', (e) => { if (e.target.closest('.poster')) return; toggle(); });
seekEl.addEventListener('input', () => seek(parseFloat(seekEl.value)));
const bCC = $('#bCC'), bMute = $('#bMute'), player = $('#player');
function press(btn, state) { btn.setAttribute('aria-pressed', state); }
bCC.onclick = () => { const off = stage.classList.toggle('nocc'); press(bCC, !off); };
bMute.onclick = () => { audio.muted = !audio.muted; press(bMute, !audio.muted); };
$('#bFS').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (player.requestFullscreen) player.requestFullscreen().catch(() => {}); };
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea') && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'arrowright') seek(now() + 5);
  else if (k === 'arrowleft') seek(now() - 5);
  else if (k === 'n') chapter(1);
  else if (k === 'p') chapter(-1);
  else if (k === 'c') bCC.click();
  else if (k === 'm') bMute.click();
  else if (k === 'f') $('#bFS').click();
});
const fit = () => { stage.style.transform = `scale(${$('#screen').clientWidth / 1280})`; };
new ResizeObserver(fit).observe($('#screen')); fit();
// Used by render.py: jump to a time on the timer clock, without the audio element.
window.__seek = (t) => { fallback = true; seek(t); render(now()); };
// At rest the title card shows complete, behind the start button.
render(0);
if (scenes[0]) {
  $$('[data-on]', scenes[0].el).forEach((el) => el.classList.add('on'));
  cues.forEach((c) => { if (scenes[0].el.contains(c.el)) c.st = true; });
}
$('#posterLbl').textContent = `${C.player.start} · ${mmss(D)} · sound on`;
shown = 0;
requestAnimationFrame(frame);
</script>
